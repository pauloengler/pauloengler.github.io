<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paulo Engler</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Inter:wght@400&family=Unbounded:wght@300;400;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="header.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0A; color: #0A0A0A; font-family: 'Unbounded', sans-serif; font-weight: 300; min-height: 100vh; }
    .site { display: flex; flex-direction: column; gap: 2px; background: #0A0A0A; min-height: 100vh; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #F7F4EE; position: sticky; top: 0; z-index: 100; }
    .nav-left, .nav-right { display: flex; gap: 20px; }
    .nav-left a, .nav-right a { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(10,10,10,0.35); text-decoration: none; transition: color 0.2s; }
    .nav-left a:hover, .nav-right a:hover { color: #0A0A0A; }
    .hero { background: #F7F4EE; }
    .hero-sublines { display: flex; flex-direction: column; gap: 4px; padding: 20px 40px 32px; text-align: center; }
    .hero-sub { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(10,10,10,0.5); line-height: 1.6; }
    .hero-sub:empty { display: none; }
    .hero svg { display: block; width: 100%; aspect-ratio: 16/5; }
    @media (max-width: 600px) {
      .hero-sublines { padding: 12px 20px 20px; }
      .hero svg { aspect-ratio: unset; width: 100%; height: 48vw; }
    }
    .view-toggle { display: flex; gap: 2px; background: #0A0A0A; }
    .search-bar { background: #F7F4EE; padding: 16px 40px; border-top: 2px solid #0A0A0A; }
    .search-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(10,10,10,0.2); padding: 8px 0; font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 11px; letter-spacing: 0.05em; color: #0A0A0A; outline: none; }
    .search-input::placeholder { color: rgba(10,10,10,0.25); }
    .search-input:focus { border-bottom-color: #0A0A0A; }
    .view-btn { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 40px; background: #F7F4EE; cursor: pointer; border: none; font-family: 'DM Serif Display', serif; font-style: italic; font-size: 32px; color: rgba(10,10,10,0.3); transition: color 0.2s, background 0.2s; text-align: center; }
    .view-btn.active { color: #0A0A0A; background: #F7F4EE; }
    .view-btn:not(.active) { background: #EEEAE2; }
    .view-btn:hover { color: #0A0A0A; }
    .chapter-header { display: flex; justify-content: center; padding: 20px 40px; background: #F7F4EE; }
    .chapter-label { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 32px; color: #0A0A0A; }
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2px; background: #0A0A0A; border-top: 2px solid #0A0A0A; border-bottom: 2px solid #0A0A0A; }
    .project-card { display: flex; flex-direction: column; background: #F7F4EE; padding: 12px; text-decoration: none; color: inherit; transition: background 0.2s; }
    .project-card:hover { background: #EEEAE2; }
    .award-icons { display: flex; justify-content: flex-end; align-items: flex-end; gap: 0; margin-bottom: 8px; width: 100%; }
    .award-col { display: flex; flex-direction: column; flex: 0 0 calc((100% - 9px) / 10); width: calc((100% - 9px) / 10); overflow: hidden; border-radius: 4px; border: none; margin-left: 1px; }
    .award-col:first-child { margin-left: 0; }
    .award-cell { display: flex; flex-direction: row; align-items: center; justify-content: space-between; padding: 1px 4px; height: 15px; font-family: 'Inter', sans-serif; text-transform: uppercase; }
    .award-cell .cell-metal { font-size: 7px; font-weight: 400; letter-spacing: 0.02em; line-height: 1; }
    .award-cell .cell-count { font-size: 8px; font-weight: 700; line-height: 1; }
    .award-cell.metal-gp     { background: #1A1A1A; color: #F7F4EE; }
    .award-cell.metal-gold   { background: #A8874A; color: #fff; }
    .award-cell.metal-silver { background: #9AAFA8; color: #fff; }
    .award-cell.metal-bronze { background: #926650; color: #fff; }
    .award-cell.metal-other  { background: #C8C3B8; color: #555; }
    .award-icon-cell { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; width: 100%; background: #E8E3DA; padding: 3px; }
    .award-icon-cell img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .award-overflow-box { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 9px; color: rgba(10,10,10,0.35); background: #E8E3DA; letter-spacing: 0; }
    .award-spacer { margin-bottom: 8px; }
    .project-thumb { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #DDD9D0; border-radius: 10px; }
    .project-thumb img, .project-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .project-info { padding: 12px 4px 4px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .project-info-top { display: flex; justify-content: space-between; align-items: stretch; gap: 10px; }
    .project-meta { flex: 1; }
    .project-client { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(10,10,10,0.3); margin-bottom: 5px; }
    .project-name { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 13px; color: #0A0A0A; line-height: 1.15; text-transform: uppercase; letter-spacing: -0.01em; }
    .btn-view { flex-shrink: 0; font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 7px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(10,10,10,0.45); border: 1px solid rgba(10,10,10,0.2); padding: 0 12px; height: 44px; white-space: nowrap; display: flex; align-items: center; border-radius: 4px; transition: color 0.2s, border-color 0.2s; align-self: flex-start; }
    .card-btns { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; align-self: flex-start; }
    .btn-quick { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 7px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(10,10,10,0.35); border: 1px solid rgba(10,10,10,0.12); padding: 0 10px; height: 18px; white-space: nowrap; display: flex; align-items: center; border-radius: 3px; transition: color 0.2s, border-color 0.2s; cursor: pointer; background: none; }
    .btn-quick:hover { color: #0A0A0A; border-color: rgba(10,10,10,0.4); }
    .project-card:hover .btn-view { color: #0A0A0A; border-color: rgba(10,10,10,0.5); }
    /* Modal */
    .qv-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,10,0.85); z-index: 1000; align-items: center; justify-content: center; }
    .qv-overlay.open { display: flex; }
    .qv-box { position: relative; width: min(860px, 92vw); background: #0A0A0A; border-radius: 4px; overflow: hidden; }
    .qv-media { position: relative; width: 100%; padding-top: 56.25%; }
    .qv-media iframe, .qv-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; border: none; }
    .qv-close { position: absolute; top: 12px; right: 14px; font-family: 'Unbounded', sans-serif; font-size: 10px; color: rgba(255,255,255,0.5); cursor: pointer; background: none; border: none; letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.2s; z-index: 10; }
    .qv-close:hover { color: #fff; }
    .qv-title { padding: 14px 16px; font-family: 'Unbounded', sans-serif; font-size: 9px; font-weight: 300; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
    .project-desc { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 11px; color: rgba(10,10,10,0.6); line-height: 1.75; }
    .loading { padding: 60px; text-align: center; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(10,10,10,0.3); background: #F7F4EE; grid-column: 1 / -1; }
    footer { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #F7F4EE; margin-top: auto; }
    .footer-left, .footer-right { display: flex; gap: 20px; }
    .footer-left a, .footer-right a { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(10,10,10,0.35); text-decoration: none; transition: color 0.2s; }
    .footer-left a:hover, .footer-right a:hover { color: #0A0A0A; }
    @media (max-width: 600px) {
      nav { padding: 16px 20px; }
      .hero { padding: 48px 20px 40px; }
      .chapter-header { padding: 16px 20px; }
      .projects-grid { grid-template-columns: 1fr; }
      footer { padding: 16px 20px; flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVn3Mw1D4qw9pc_ifibalqvnFv3rEf1xQ8eFNvXNY_t8UyH1c8_MkfTG8KkrczCnsyYaQo4lW2O0E3/pub?output=csv';
const ABOUT_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVn3Mw1D4qw9pc_ifibalqvnFv3rEf1xQ8eFNvXNY_t8UyH1c8_MkfTG8KkrczCnsyYaQo4lW2O0E3/pub?gid=1943812170&single=true&output=csv';
const CHAPTER_ORDER = ['Activations', 'Campaigns', 'Print & Design', 'Other'];

function parseCSV(text, filterKey, skipFirst) {
  const result = [];
  const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  let pos = 0;

  function parseRow() {
    const cols = [];
    while (pos < normalized.length) {
      if (normalized[pos] === '"') {
        pos++;
        let val = '';
        while (pos < normalized.length) {
          if (normalized[pos] === '"' && normalized[pos+1] === '"') {
            val += '"'; pos += 2;
          } else if (normalized[pos] === '"') {
            pos++; break;
          } else {
            val += normalized[pos++];
          }
        }
        cols.push(val);
        if (normalized[pos] === ',') pos++;
        else break;
      } else {
        let val = '';
        while (pos < normalized.length && normalized[pos] !== ',' && normalized[pos] !== '\n') {
          val += normalized[pos++];
        }
        cols.push(val.trim());
        if (normalized[pos] === ',') pos++;
        else break;
      }
    }
    if (normalized[pos] === '\n') pos++;
    return cols;
  }

  if (skipFirst !== false) parseRow(); // skip decorative label row (projects sheet)
  const headers = parseRow().map(h => h.toLowerCase().trim());
  while (pos < normalized.length) {
    const cols = parseRow();
    if (cols.every(c => !c)) continue;
    const obj = {};
    cols.forEach(function(val, i) {
      const key = (headers[i] && headers[i] !== '') ? headers[i] : 'col' + (i + 1);
      obj[key] = val || '';
    });
    if (filterKey ? obj[filterKey] : Object.values(obj).some(v => v)) result.push(obj);
  }
  return result;
}

async function loadSettings(projects) {
  try {
    const res = await fetch(ABOUT_URL, { mode:'cors', credentials:'omit', redirect:'follow' });
    const text = await res.text();
    const rows = parseCSV(text, null, false);

    // Compute dynamic totals from projects (no shortlists)
    let totalAwards = 0, totalCannes = 0, totalGP = 0;
    const AWARD_KEYS2 = ['ame','andys','cannes','caples','clio','cliohealth','dandad','elojo','euro','fiap','lia','loeries','lynx','madstars','newyork','one','phnks','wark','wave','webby','wpp'];
    (projects||[]).forEach(function(p) {
      AWARD_KEYS2.forEach(function(show) {
        ['gp','g','s','b','sh'].forEach(function(m) {
          const v = parseInt(p[show + '_' + m] || 0);
          if (v > 0) totalAwards += v;                              // all metals + shortlists
          if (show === 'cannes' && m !== 'sh' && v > 0) totalCannes += v; // Lions excl. shortlists
        });
      });
      // GP: only Cannes Grand Prix
      const gp = parseInt(p['cannes_gp'] || 0);
      if (gp > 0) totalGP += gp;
    });

    function applyTokens(str) {
      return str
        .replace(/\{\{total\}\}/g, totalAwards)
        .replace(/\{\{cannes\}\}/g, totalCannes)
        .replace(/\{\{gp\}\}/g, totalGP);
    }

    const sublines = rows.filter(r=>/^subline\d+$/.test(r.block)).sort((a,b)=>a.block.localeCompare(b.block, undefined, {numeric:true}));
    const sublinesEl = document.getElementById('hero-sublines');
    if (sublinesEl) sublinesEl.innerHTML = sublines.map(function(r){
      return '<p class="hero-sub">' + applyTokens(r.col1||'') + '</p>';
    }).join('');
  } catch (err) {
    console.error('Settings load error:', err);
  }
}

async function loadProjects() {
  try {
    const CACHE_KEY = 'portfolio_csv_v1';
    const CACHE_AGE = 5 * 60 * 1000; // 5 minutes
    const cached = sessionStorage.getItem(CACHE_KEY);
    const cachedTime = sessionStorage.getItem(CACHE_KEY + '_time');
    let text;
    if (cached && cachedTime && (Date.now() - parseInt(cachedTime)) < CACHE_AGE) {
      text = cached;
    } else {
      const res = await fetch(SHEET_URL, { mode: 'cors', credentials: 'omit', redirect: 'follow' });
      text = await res.text();
      try { sessionStorage.setItem(CACHE_KEY, text); sessionStorage.setItem(CACHE_KEY + '_time', Date.now()); } catch(e) {}
    }
    const projects = parseCSV(text, 'name', true);
    renderProjects(projects);
    loadSettings(projects);
  } catch (err) {
    document.getElementById('main-content').innerHTML = '<div class="projects-grid"><p class="loading">Could not load projects.</p></div>';
  }
}

function renderProjects(projects) {
  const chapters = {};
  CHAPTER_ORDER.forEach(ch => { chapters[ch] = []; });
  projects.forEach(p => {
    if (currentSearch) {
      // Search mode: always search full list
      const fullVal = (p['full'] || '').toString().toUpperCase();
      if (fullVal !== 'TRUE') return;
      const searchable = [p.name, p.client, p['description thumb'], p['descriptionthumb'], p.description, p.tags, p.chapter]
        .filter(Boolean).join(' ').toLowerCase();
      if (!searchable.includes(currentSearch)) return;
    } else if (currentView === 'select') {
      const val = (p['select'] || '').toString().toUpperCase();
      if (val !== 'TRUE') return;
    } else {
      const val = (p['full'] || '').toString().toUpperCase();
      if (val !== 'TRUE') return;
    }
    const ch = p.chapter || 'Other';
    if (!chapters[ch]) chapters[ch] = [];
    chapters[ch].push(p);
  });

  const main = document.getElementById('main-content');
  main.innerHTML = '';

  CHAPTER_ORDER.forEach(chapterName => {
    const items = chapters[chapterName];
    if (!items || items.length === 0) return;

    const header = document.createElement('div');
    header.className = 'chapter-header';
    header.innerHTML = '<span class="chapter-label">' + chapterName + '</span>';
    main.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'projects-grid';
    items.forEach(p => grid.appendChild(buildCard(p)));
    main.appendChild(grid);
  });

  requestAnimationFrame(function() {
    requestAnimationFrame(equaliseAwardHeights);
  });
}

function equaliseAwardHeights() {
  document.querySelectorAll('.projects-grid').forEach(function(grid) {
    const awardDivs = Array.from(grid.querySelectorAll('.award-icons, .award-spacer'));
    if (!awardDivs.length) return;
    awardDivs.forEach(function(el) { el.style.height = ''; });
    const rows = {};
    awardDivs.forEach(function(el) {
      const key = Math.round(el.getBoundingClientRect().top);
      if (!rows[key]) rows[key] = [];
      rows[key].push(el);
    });
    Object.values(rows).forEach(function(row) {
      const maxH = Math.max.apply(null, row.map(function(el) { return el.scrollHeight; }));
      row.forEach(function(el) { el.style.height = maxH + 'px'; });
    });
  });
}

window.addEventListener('resize', equaliseAwardHeights);

function buildCard(p) {
  const a = document.createElement('a');
  a.className = 'project-card';
  a.href = 'project.html?id=' + (p.slug || slugify(p.name));

  const METALS = ['gp', 'gold', 'silver', 'bronze', 'short'];

  function metalClass(m) {
    if (m === 'gp')     return 'metal-gp';
    if (m === 'gold')   return 'metal-gold';
    if (m === 'silver') return 'metal-silver';
    if (m === 'bronze') return 'metal-bronze';
    return 'metal-other';
  }

  function metalLabel(awardName, metal) {
    if (awardName.toLowerCase() === 'dandad') {
      const map = { gp: 'B', gold: 'Y', silver: 'G', bronze: 'W', short: 'Sh' };
      return map[metal] || metal.toUpperCase();
    }
    const map = { gp: 'GP', gold: 'G', silver: 'S', bronze: 'B', short: 'Sh', merit: 'M' };
    return map[metal.toLowerCase()] || metal.toUpperCase();
  }

  const AWARD_KEYS = ['ame','archive','andys','cannes','caples','clio','cliohealth','dandad','elojo','euro','fiap','lia','loeries','lynx','madstars','newyork','one','phnks','wark','wave','webby','wpp'];
  const metalColMap = { gp:'gp', gold:'g', silver:'s', bronze:'b', short:'sh' };
  // Awards with no metal tiers — just show the icon
  const ICON_ONLY_SHOWS = ['archive'];

  const awardCols = [];
  AWARD_KEYS.forEach(function(show) {
    if (ICON_ONLY_SHOWS.includes(show)) {
      const val = (p[show] || '').toString().trim();
      if (val && val !== '0' && val.toUpperCase() !== 'FALSE') {
        awardCols.push({ name: show, metals: [], iconOnly: true });
      }
      return;
    }
    const metals = [];
    METALS.forEach(function(m) {
      const col = show + '_' + metalColMap[m];
      const val = parseInt(p[col] || 0);
      if (val > 0) metals.push({ metal: m, count: val });
    });
    if (metals.length) awardCols.push({ name: show, metals: metals, iconOnly: false });
  });

  // If more than 10 award columns, hide low-priority shows and add overflow box
  const OVERFLOW_THRESHOLD = 10;
  const OVERFLOW_HIDDEN = ['archive', 'caples', 'phnks'];
  let overflowCount = 0;
  let visibleCols = awardCols;
  if (awardCols.length > OVERFLOW_THRESHOLD) {
    visibleCols = awardCols.filter(function(col) {
      if (OVERFLOW_HIDDEN.includes(col.name)) {
        overflowCount++;
        return false;
      }
      return true;
    });
  }

  let iconsHTML;
  if (visibleCols.length) {
    let colsHTML = visibleCols.map(function(col) {
      const cells = col.iconOnly ? '' : col.metals.map(function(m) {
        const label = metalLabel(col.name, m.metal);
        const countHTML = '<span class="cell-count">' + m.count + '</span>';
        const metalHTML = '<span class="cell-metal">' + label + '</span>';
        return '<div class="award-cell ' + metalClass(m.metal) + '">' + metalHTML + countHTML + '</div>';
      }).join('');
      const iconCell = '<div class="award-icon-cell">'
        + '<img src="icons/' + col.name.toLowerCase() + '.png" alt="' + col.name + '">'
        + '</div>';
      return '<div class="award-col">' + cells + iconCell + '</div>';
    }).join('');

    if (overflowCount > 0) {
      colsHTML += '<div class="award-col award-col--overflow">'
        + '<div class="award-icon-cell award-overflow-box">+' + overflowCount + '</div>'
        + '</div>';
    }

    iconsHTML = '<div class="award-icons">' + colsHTML + '</div>';
  } else {
    iconsHTML = '<div class="award-spacer"></div>';
  }

  let thumbInner = '';
  const thumb = (p.thumbnail || '').trim();
  if (thumb) {
    const isVideo = thumb.toLowerCase().endsWith('.mp4') || thumb.toLowerCase().endsWith('.webm');
    if (isVideo) {
      thumbInner = '<video src="thumbnail/' + thumb + '" autoplay loop muted playsinline></video>';
    } else {
      thumbInner = '<img src="thumbnail/' + thumb + '" alt="' + p.name + '" loading="lazy">';
    }
  }

  const descHTML = (p['description thumb'] || p['descriptionthumb'] || p.description || '') ? '<p class="project-desc">' + (p['description thumb'] || p['descriptionthumb'] || p.description || '') + '</p>' : '';

  // Parse first media item for quick view
  const mediaStr = (p.media || '').trim();
  let firstMedia = '';
  if (mediaStr) {
    const firstItem = mediaStr.split('|')[0].trim();
    if (firstItem.startsWith('vid:')) firstMedia = firstItem.slice(4).trim();
    else if (firstItem.startsWith('img:')) firstMedia = 'media/' + firstItem.slice(4).trim();
  }

  a.innerHTML = iconsHTML +
    '<div class="project-thumb">' + thumbInner + '</div>' +
    '<div class="project-info">' +
      '<div class="project-info-top">' +
        '<div class="project-meta">' +
          '<p class="project-client">' + (p.client || '') + '</p>' +
          '<p class="project-name">' + p.name + '</p>' +
        '</div>' +
        '<div class="card-btns">' +
          '<span class="btn-view">View Project →</span>' +
          (firstMedia ? '<button class="btn-quick" data-media=\''+firstMedia+'\'  data-name=\''+p.name+'\' onclick="quickView(event,this)">Quick View</button>' : '') +
        '</div>' +
      '</div>' +
      descHTML +
    '</div>';

  return a;
}

function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

let currentView = 'full';
let currentSearch = '';

function setView(view) {
  currentView = view;
  document.getElementById('btn-full').classList.toggle('active', view === 'full');
  document.getElementById('btn-select').classList.toggle('active', view === 'select');
  // Clear search when switching views
  document.getElementById('search-input').value = '';
  currentSearch = '';
  const cached = sessionStorage.getItem('portfolio_csv_v1');
  if (cached) {
    const projects = parseCSV(cached, 'name', true);
    renderProjects(projects);
  }
}

function doSearch(query) {
  currentSearch = query.toLowerCase().trim();
  // Deselect both buttons when search is active
  document.getElementById('btn-full').classList.toggle('active', !currentSearch && currentView === 'full');
  document.getElementById('btn-select').classList.toggle('active', !currentSearch && currentView === 'select');
  const cached = sessionStorage.getItem('portfolio_csv_v1');
  if (cached) {
    const projects = parseCSV(cached, 'name', true);
    renderProjects(projects);
  }
}

// Set default active button
document.getElementById('btn-full').classList.add('active');

// Search input listener
document.getElementById('search-input').addEventListener('input', function() {
  doSearch(this.value);
});

loadProjects();

function getYouTubeId(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/))([\w-]{11})/);
  return m ? m[1] : null;
}

function quickView(e, btn) {
  e.preventDefault();
  e.stopPropagation();
  const media = btn.getAttribute('data-media');
  const name = btn.getAttribute('data-name');
  const box = document.getElementById('qv-media');
  const title = document.getElementById('qv-title');
  const overlay = document.getElementById('qv-overlay');

  title.textContent = name;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  const ytId = getYouTubeId(media);
  if (ytId) {
    // Inject iframe after overlay is visible so browser honours autoplay on user gesture
    requestAnimationFrame(function() {
      box.innerHTML = '<iframe src="https://www.youtube.com/embed/' + ytId + '?autoplay=1&mute=0&rel=0&modestbranding=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
    });
  } else {
    box.innerHTML = '<img src="' + media + '" alt="' + name + '">';
  }
}

function closeQuickView(e) {
  if (e && e.target !== document.getElementById('qv-overlay') && !e.target.classList.contains('qv-close')) return;
  const overlay = document.getElementById('qv-overlay');
  overlay.classList.remove('open');
  document.getElementById('qv-media').innerHTML = ''; // stop video
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeQuickView({ target: document.getElementById('qv-overlay') });
});
</script>

    <div class="qv-media" id="qv-media"></div>
    <div class="qv-title" id="qv-title"></div>
