<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paulo Engler</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Unbounded:wght@300;400;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0A; color: #0A0A0A; font-family: 'Unbounded', sans-serif; font-weight: 300; min-height: 100vh; }
    .site { display: flex; flex-direction: column; gap: 2px; background: #0A0A0A; min-height: 100vh; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #F7F4EE; position: sticky; top: 0; z-index: 100; }
    .nav-left, .nav-right { display: flex; gap: 20px; }
    .nav-left a, .nav-right a { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(10,10,10,0.35); text-decoration: none; transition: color 0.2s; }
    .nav-left a:hover, .nav-right a:hover { color: #0A0A0A; }
    .hero { padding: 72px 40px 60px; text-align: center; background: #F7F4EE; }
    .hero h1 { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: clamp(24px, 3.5vw, 40px); color: #0A0A0A; line-height: 1.1; letter-spacing: -0.02em; text-transform: uppercase; }
    .hero h1 em { display: block; font-family: 'DM Serif Display', serif; font-style: italic; font-weight: 400; font-size: clamp(48px, 7vw, 80px); letter-spacing: -0.02em; text-transform: none; line-height: 0.9; }
    .hero-sub { margin-top: 24px; font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(10,10,10,0.35); }
    .chapter-header { display: flex; justify-content: center; padding: 20px 40px; background: #F7F4EE; }
    .chapter-label { font-family: 'DM Serif Display', serif; font-style: italic; font-size: 32px; color: #0A0A0A; }
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2px; background: #0A0A0A; border-top: 2px solid #0A0A0A; border-bottom: 2px solid #0A0A0A; }
    .project-card { display: flex; flex-direction: column; background: #F7F4EE; padding: 12px; text-decoration: none; color: inherit; transition: background 0.2s; }
    .project-card:hover { background: #EEEAE2; }
    .project-card:hover .btn-view { color: #0A0A0A; border-color: rgba(10,10,10,0.5); }
    .award-icons { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; margin-bottom: 8px; }
    .award-row { display: flex; justify-content: flex-end; gap: 2px; }
    .award-pill { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; width: 32px; height: 32px; font-family: 'Inter', sans-serif; letter-spacing: 0.04em; text-transform: uppercase; flex-shrink: 0; }
    .award-pill .pill-count { font-size: 8px; font-weight: 700; line-height: 1; }
    .award-pill .pill-metal { font-size: 5px; font-weight: 400; line-height: 1; margin-top: 2px; opacity: 0.9; }
    .award-pill.metal-gp     { background: #0A0A0A; color: #F7F4EE; }
    .award-pill.metal-gold   { background: #C9A84C; color: #fff; }
    .award-pill.metal-silver { background: #A8A8A8; color: #fff; }
    .award-pill.metal-bronze { background: #A0522D; color: #fff; }
    .award-pill.metal-other  { background: transparent; color: rgba(10,10,10,0.6); border: 1px solid rgba(10,10,10,0.3); }
    .award-spacer { margin-bottom: 8px; }
    .project-thumb { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #DDD9D0; border-radius: 10px; }
    .project-thumb img, .project-thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .project-info { padding: 12px 4px 4px; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .project-info-top { display: flex; justify-content: space-between; align-items: stretch; gap: 10px; }
    .project-meta { flex: 1; }
    .project-client { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(10,10,10,0.3); margin-bottom: 5px; }
    .project-name { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 13px; color: #0A0A0A; line-height: 1.15; text-transform: uppercase; letter-spacing: -0.01em; }
    .btn-view { flex-shrink: 0; font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 7px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(10,10,10,0.45); border: 1px solid rgba(10,10,10,0.2); padding: 0 12px; height: 44px; white-space: nowrap; display: flex; align-items: center; border-radius: 4px; transition: color 0.2s, border-color 0.2s; align-self: flex-start; }
    .project-desc { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 9px; color: rgba(10,10,10,0.4); line-height: 1.75; }
    .loading { padding: 60px; text-align: center; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(10,10,10,0.3); background: #F7F4EE; grid-column: 1 / -1; }
    footer { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #F7F4EE; margin-top: auto; }
    .footer-left, .footer-right { display: flex; gap: 20px; }
    .footer-left a, .footer-right a { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(10,10,10,0.35); text-decoration: none; transition: color 0.2s; }
    .footer-left a:hover, .footer-right a:hover { color: #0A0A0A; }
    @media (max-width: 600px) {
      nav { padding: 16px 20px; }
      .hero { padding: 48px 20px 40px; }
      .chapter-header { padding: 16px 20px; }
      .projects-grid { grid-template-columns: 1fr; }
      footer { padding: 16px 20px; flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>
<div class="site">

<nav>
  <div class="nav-left">
    <a href="mailto:pauloengler@gmail.com">pauloengler@gmail.com</a>
    <a href="tel:+971556690393">+971 55 6690393</a>
  </div>
  <div class="nav-right">
    <a href="index.html">Work</a>
    <a href="about.html">About</a>
  </div>
</nav>

<section class="hero">
  <h1>Senior Creative<em>Director</em>& Head of Art</h1>
  <p class="hero-sub" id="hero-subline">20+ years &nbsp;·&nbsp; Brazil - Dubai &nbsp;·&nbsp; 1 Grand Prix, 20+ Lions, D&AD &nbsp;·&nbsp; One Show &nbsp;·&nbsp; Clio</p>
</section>

<main id="main-content">
  <div class="projects-grid">
    <p class="loading">Loading projects...</p>
  </div>
</main>

<footer>
  <div class="footer-left">
    <a href="mailto:pauloengler@gmail.com">pauloengler@gmail.com</a>
    <a href="tel:+971556690393">+971 55 6690393</a>
  </div>
  <div class="footer-right">
    <a href="index.html">Work</a>
    <a href="about.html">About</a>
  </div>
</footer>

</div>
<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVn3Mw1D4qw9pc_ifibalqvnFv3rEf1xQ8eFNvXNY_t8UyH1c8_MkfTG8KkrczCnsyYaQo4lW2O0E3/pub?output=csv';
const SETTINGS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVn3Mw1D4qw9pc_ifibalqvnFv3rEf1xQ8eFNvXNY_t8UyH1c8_MkfTG8KkrczCnsyYaQo4lW2O0E3/pub?gid=843736092&single=true&output=csv';
const CHAPTER_ORDER = ['Activations', 'Campaigns', 'Print & Design', 'Other'];

function parseLine(line) {
  const cols = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"' && !inQ) { inQ = true; }
    else if (ch === '"' && inQ) { inQ = false; }
    else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
    else { cur += ch; }
  }
  cols.push(cur.trim());
  return cols;
}

function parseCSV(text, filterKey) {
  const lines = text.trim().replace(/\r/g, '').split('\n');
  const headers = parseLine(lines[0]).map(h => h.toLowerCase().trim());
  return lines.slice(1).map(line => {
    const cols = parseLine(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h] = cols[i] || ''; });
    return obj;
  }).filter(r => filterKey ? r[filterKey] : Object.values(r).some(v => v));
}

async function loadSettings() {
  if (!SETTINGS_URL) return;
  try {
    const res = await fetch(SETTINGS_URL);
    const text = await res.text();
    const rows = parseCSV(text, 'key');
    const settings = {};
    rows.forEach(r => { if (r.key) settings[r.key.trim()] = r.value; });
    if (settings.subline) document.getElementById('hero-subline').textContent = settings.subline;
  } catch (err) {
    console.error('Settings load error:', err);
  }
}

async function loadProjects() {
  try {
    const res = await fetch(SHEET_URL);
    const text = await res.text();
    const projects = parseCSV(text, 'name');
    if (projects.length > 0) { projects.forEach(function(proj, idx) { for (var i = 1; i <= 12; i++) { var raw = (proj['award' + i + 'count'] || '').trim(); var cnt = raw ? parseInt(raw) : 1; console.log('[DEBUG]', proj.name, 'slot', i, '| name:', proj['award'+i], '| label:', proj['award'+i+'label'], '| countRaw:', JSON.stringify(raw), '| count:', cnt, '| >3:', cnt > 3); } }); }
    renderProjects(projects);
  } catch (err) {
    document.getElementById('main-content').innerHTML = '<div class="projects-grid"><p class="loading">Could not load projects.</p></div>';
  }
}

function renderProjects(projects) {
  const chapters = {};
  CHAPTER_ORDER.forEach(ch => { chapters[ch] = []; });
  projects.forEach(p => {
    const ch = p.chapter || 'Other';
    if (!chapters[ch]) chapters[ch] = [];
    chapters[ch].push(p);
  });

  const main = document.getElementById('main-content');
  main.innerHTML = '';

  CHAPTER_ORDER.forEach(chapterName => {
    const items = chapters[chapterName];
    if (!items || items.length === 0) return;

    const header = document.createElement('div');
    header.className = 'chapter-header';
    header.innerHTML = '<span class="chapter-label">' + chapterName + '</span>';
    main.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'projects-grid';
    items.forEach(p => grid.appendChild(buildCard(p)));
    main.appendChild(grid);
  });

  requestAnimationFrame(function() {
    requestAnimationFrame(equaliseAwardHeights);
  });
}

function equaliseAwardHeights() {
  document.querySelectorAll('.projects-grid').forEach(function(grid) {
    const awardDivs = Array.from(grid.querySelectorAll('.award-icons, .award-spacer'));
    if (!awardDivs.length) return;
    awardDivs.forEach(function(el) { el.style.height = ''; });
    const rows = {};
    awardDivs.forEach(function(el) {
      const key = Math.round(el.getBoundingClientRect().top);
      if (!rows[key]) rows[key] = [];
      rows[key].push(el);
    });
    Object.values(rows).forEach(function(row) {
      const maxH = Math.max.apply(null, row.map(function(el) { return el.scrollHeight; }));
      row.forEach(function(el) { el.style.height = maxH + 'px'; });
    });
  });
}

window.addEventListener('resize', equaliseAwardHeights);

function buildCard(p) {
  const a = document.createElement('a');
  a.className = 'project-card';
  a.href = 'project.html?id=' + (p.slug || slugify(p.name));

  const awardSlots = [];
  for (let i = 1; i <= 20; i++) {
    const name  = (p['award' + i]           || '').trim();
    const metal = (p['award' + i + 'label'] || '').trim();
    const countRaw = (p['award' + i + 'count'] || '').trim();
    const count = countRaw ? parseInt(countRaw) : 1;
    if (name && name.toUpperCase() !== 'NA' && metal && metal.toUpperCase() !== 'NA') {
      awardSlots.push({ name: name, metal: metal, count: count });
    }
  }

  function metalClass(metal) {
    const m = metal.toLowerCase();
    if (m === 'gp')     return 'metal-gp';
    if (m === 'gold')   return 'metal-gold';
    if (m === 'silver') return 'metal-silver';
    if (m === 'bronze') return 'metal-bronze';
    return 'metal-other';
  }

  let iconsHTML;
  if (awardSlots.length) {
    // Group slots by award name
    const groups = {};
    const groupOrder = [];
    awardSlots.forEach(function(slot) {
      if (!groups[slot.name]) { groups[slot.name] = []; groupOrder.push(slot.name); }
      groups[slot.name].push(slot);
    });

    // Build flat list of pills
    const allPills = [];
    groupOrder.forEach(function(name) {
      groups[name].forEach(function(slot) {
        const countLine = slot.count > 1 ? '<span class="pill-count">X' + slot.count + '</span>' : '';
        const metalLine = '<span class="pill-metal">' + slot.metal.toUpperCase() + '</span>';
        allPills.push('<span class="award-pill ' + metalClass(slot.metal) + '">' + countLine + metalLine + '</span>');
      });
    });

    // Split into max 2 rows of 15
    const row1 = allPills.slice(0, 15);
    const row2 = allPills.slice(15, 30);
    let rowsHTML = '<div class="award-row">' + row1.join('') + '</div>';
    if (row2.length) rowsHTML = '<div class="award-row">' + row2.join('') + '</div>' + rowsHTML;

    iconsHTML = '<div class="award-icons">' + rowsHTML + '</div>';
  } else {
    iconsHTML = '<div class="award-spacer"></div>';
  }

  let thumbInner = '';
  if (p.thumbnail) {
    const isVideo = p.thumbnail.toLowerCase().endsWith('.mp4');
    if (isVideo) {
      thumbInner = '<video src="thumbnail/' + p.thumbnail + '" autoplay loop muted playsinline></video>';
    } else {
      thumbInner = '<img src="thumbnail/' + p.thumbnail + '" alt="' + p.name + '" loading="lazy">';
    }
  }

  const descHTML = p.description ? '<p class="project-desc">' + p.description + '</p>' : '';

  a.innerHTML = iconsHTML +
    '<div class="project-thumb">' + thumbInner + '</div>' +
    '<div class="project-info">' +
      '<div class="project-info-top">' +
        '<div class="project-meta">' +
          '<p class="project-client">' + (p.client || '') + '</p>' +
          '<p class="project-name">' + p.name + '</p>' +
        '</div>' +
        '<span class="btn-view">View Project</span>' +
      '</div>' +
      descHTML +
    '</div>';

  return a;
}

function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

console.log('[VERSION] portfolio v3 loaded');
loadSettings();
loadProjects();
</script>
</body>
</html>
