<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVn3Mw1D4qw9pc_ifibalqvnFv3rEf1xQ8eFNvXNY_t8UyH1c8_MkfTG8KkrczCnsyYaQo4lW2O0E3/pub?output=csv';
const ABOUT_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVn3Mw1D4qw9pc_ifibalqvnFv3rEf1xQ8eFNvXNY_t8UyH1c8_MkfTG8KkrczCnsyYaQo4lW2O0E3/pub?gid=1943812170&single=true&output=csv';
const CHAPTER_ORDER = ['Activations', 'Campaigns', 'Print & Design', 'Other'];
const CACHE_KEY = 'portfolio_csv_v2';
const ABOUT_KEY = 'portfolio_about_v2';
const CACHE_AGE = 30 * 60 * 1000; // 30 minutes

// Parsed projects stored in memory — no re-parsing on view/search change
let _projects = null;

function parseCSV(text, filterKey, skipFirst) {
  const result = [];
  const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  let pos = 0;

  function parseRow() {
    const cols = [];
    while (pos < normalized.length) {
      if (normalized[pos] === '"') {
        pos++;
        let val = '';
        while (pos < normalized.length) {
          if (normalized[pos] === '"' && normalized[pos+1] === '"') {
            val += '"'; pos += 2;
          } else if (normalized[pos] === '"') {
            pos++; break;
          } else {
            val += normalized[pos++];
          }
        }
        cols.push(val);
        if (normalized[pos] === ',') pos++;
        else break;
      } else {
        let val = '';
        while (pos < normalized.length && normalized[pos] !== ',' && normalized[pos] !== '\n') {
          val += normalized[pos++];
        }
        cols.push(val.trim());
        if (normalized[pos] === ',') pos++;
        else break;
      }
    }
    if (normalized[pos] === '\n') pos++;
    return cols;
  }

  if (skipFirst !== false) parseRow();
  const headers = parseRow().map(h => h.toLowerCase().trim());
  while (pos < normalized.length) {
    const cols = parseRow();
    if (cols.every(c => !c)) continue;
    const obj = {};
    cols.forEach(function(val, i) {
      const key = (headers[i] && headers[i] !== '') ? headers[i] : 'col' + (i + 1);
      obj[key] = val || '';
    });
    if (filterKey ? obj[filterKey] : Object.values(obj).some(v => v)) result.push(obj);
  }
  return result;
}

function renderSublines(rows, totalAwards, totalCannes, totalGP) {
  function applyTokens(str) {
    return str
      .replace(/\{\{total\}\}/g, totalAwards)
      .replace(/\{\{cannes\}\}/g, totalCannes)
      .replace(/\{\{gp\}\}/g, totalGP);
  }
  const sublines = rows.filter(r=>/^subline\d+$/.test(r.block)).sort((a,b)=>a.block.localeCompare(b.block, undefined, {numeric:true}));
  const sublinesEl = document.getElementById('hero-sublines');
  if (sublinesEl) sublinesEl.innerHTML = sublines.map(function(r){
    return '<p class="hero-sub">' + applyTokens(r.col1||'') + '</p>';
  }).join('');
}

async function loadSettings(projects, aboutRows) {
  try {
    let totalAwards = 0, totalCannes = 0, totalGP = 0;
    const AWARD_KEYS2 = ['ame','andys','cannes','caples','clio','cliohealth','dandad','elojo','euro','fiap','lia','loeries','lynx','madstars','newyork','one','phnks','wark','wave','webby','wpp'];
    (projects||[]).forEach(function(p) {
      AWARD_KEYS2.forEach(function(show) {
        ['gp','g','s','b','sh'].forEach(function(m) {
          const v = parseInt(p[show + '_' + m] || 0);
          if (v > 0) totalAwards += v;
          if (show === 'cannes' && m !== 'sh' && v > 0) totalCannes += v;
        });
      });
      const gp = parseInt(p['cannes_gp'] || 0);
      if (gp > 0) totalGP += gp;
    });
    renderSublines(aboutRows, totalAwards, totalCannes, totalGP);
  } catch (err) {
    console.error('Settings load error:', err);
  }
}

function cachedFetch(url, key) {
  const cached = sessionStorage.getItem(key);
  const cachedTime = sessionStorage.getItem(key + '_time');
  if (cached && cachedTime && (Date.now() - parseInt(cachedTime)) < CACHE_AGE) {
    return Promise.resolve(cached);
  }
  return fetch(url, { mode: 'cors', credentials: 'omit', redirect: 'follow' })
    .then(function(res) { return res.text(); })
    .then(function(text) {
      try { sessionStorage.setItem(key, text); sessionStorage.setItem(key + '_time', Date.now()); } catch(e) {}
      return text;
    });
}

async function loadProjects() {
  try {
    // Both fetches fire at the same moment
    const projectsPromise = cachedFetch(SHEET_URL, CACHE_KEY);
    const aboutPromise = cachedFetch(ABOUT_URL, ABOUT_KEY);

    // Resolve the default view from the about sheet BEFORE rendering any project grid,
    // so the very first render already uses the correct view — no flash of the wrong state.
    let aboutRowsCache = null;
    const viewReadyPromise = aboutPromise.then(function(aboutText) {
      const aboutRows = parseCSV(aboutText, null, false);
      aboutRowsCache = aboutRows;
      // Render sublines immediately with tokens unresolved
      renderSublines(aboutRows, '…', '…', '…');

      const viewRow = aboutRows.find(function(r) { return (r.block || '').toLowerCase().trim() === 'view'; });
      const viewVal = viewRow ? (viewRow.col1 || '').toLowerCase().trim() : '';
      if (viewVal === 'selected') {
        currentView = 'select';
        document.getElementById('btn-full').classList.remove('active');
        document.getElementById('btn-select').classList.add('active');
        moveSmileyEyes('select');
      } else {
        currentView = 'full';
        document.getElementById('btn-full').classList.add('active');
        document.getElementById('btn-select').classList.remove('active');
        moveSmileyEyes('full');
      }
      return aboutRows;
    }).catch(function(err) {
      console.error('About sheet error:', err);
      return null;
    });

    // Wait for BOTH the projects data and the resolved view before the first render
    const [projectsText] = await Promise.all([projectsPromise, viewReadyPromise]);
    _projects = parseCSV(projectsText, 'name', true);
    renderProjects(_projects);

    // Update sublines with real numbers now that both are in
    if (aboutRowsCache) loadSettings(_projects, aboutRowsCache);
  } catch (err) {
    document.getElementById('main-content').innerHTML = '<div class="projects-grid"><p class="loading">Could not load projects.</p></div>';
  }
}

function renderProjects(projects) {
  const chapters = {};
  CHAPTER_ORDER.forEach(ch => { chapters[ch] = []; });
  projects.forEach(p => {
    if (currentSearch) {
      const fullVal = (p['full'] || '').toString().toUpperCase();
      if (fullVal !== 'TRUE') return;
      const searchable = [p.name, p.client, p['description thumb'], p['descriptionthumb'], p.description, p.tags, p.chapter]
        .filter(Boolean).join(' ').toLowerCase();
      if (!searchable.includes(currentSearch)) return;
    } else if (currentView === 'select') {
      const val = (p['select'] || '').toString().toUpperCase();
      if (val !== 'TRUE') return;
    } else {
      const val = (p['full'] || '').toString().toUpperCase();
      if (val !== 'TRUE') return;
    }
    const ch = p.chapter || 'Other';
    if (!chapters[ch]) chapters[ch] = [];
    chapters[ch].push(p);
  });

  const main = document.getElementById('main-content');
  main.innerHTML = '';

  CHAPTER_ORDER.forEach(chapterName => {
    const items = chapters[chapterName];
    if (!items || items.length === 0) return;

    const header = document.createElement('div');
    header.className = 'chapter-header';
    header.innerHTML = '<span class="chapter-label">' + chapterName + '</span>';
    main.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'projects-grid';
    items.forEach(p => grid.appendChild(buildCard(p)));
    main.appendChild(grid);
  });

  requestAnimationFrame(function() {
    requestAnimationFrame(equaliseAwardHeights);
  });
}

function equaliseAwardHeights() {
  document.querySelectorAll('.projects-grid').forEach(function(grid) {
    const awardDivs = Array.from(grid.querySelectorAll('.award-icons, .award-spacer'));
    if (!awardDivs.length) return;
    awardDivs.forEach(function(el) { el.style.height = ''; });
    const rows = {};
    awardDivs.forEach(function(el) {
      const key = Math.round(el.getBoundingClientRect().top);
      if (!rows[key]) rows[key] = [];
      rows[key].push(el);
    });
    Object.values(rows).forEach(function(row) {
      const maxH = Math.max.apply(null, row.map(function(el) { return el.scrollHeight; }));
      row.forEach(function(el) { el.style.height = maxH + 'px'; });
    });
  });
}

// Debounced resize handler — prevents layout thrash on every pixel
let _resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(equaliseAwardHeights, 150);
});

function buildCard(p) {
  const a = document.createElement('a');
  a.className = 'project-card';
  a.href = 'project.html?id=' + (p.slug || slugify(p.name));

  const METALS = ['gp', 'gold', 'silver', 'bronze', 'short'];

  function metalClass(m) {
    if (m === 'gp')     return 'metal-gp';
    if (m === 'gold')   return 'metal-gold';
    if (m === 'silver') return 'metal-silver';
    if (m === 'bronze') return 'metal-bronze';
    return 'metal-other';
  }

  function metalLabel(awardName, metal) {
    if (awardName.toLowerCase() === 'dandad') {
      const map = { gp: 'B', gold: 'Y', silver: 'G', bronze: 'W', short: 'Sh' };
      return map[metal] || metal.toUpperCase();
    }
    const map = { gp: 'GP', gold: 'G', silver: 'S', bronze: 'B', short: 'Sh', merit: 'M' };
    return map[metal.toLowerCase()] || metal.toUpperCase();
  }

  const AWARD_KEYS = ['ame','archive','andys','cannes','caples','clio','cliohealth','dandad','elojo','euro','fiap','lia','loeries','lynx','madstars','newyork','one','phnks','wark','wave','webby','wpp'];
  const metalColMap = { gp:'gp', gold:'g', silver:'s', bronze:'b', short:'sh' };
  const ICON_ONLY_SHOWS = ['archive'];

  const awardCols = [];
  AWARD_KEYS.forEach(function(show) {
    if (ICON_ONLY_SHOWS.includes(show)) {
      const val = (p[show] || '').toString().trim();
      if (val && val !== '0' && val.toUpperCase() !== 'FALSE') {
        awardCols.push({ name: show, metals: [], iconOnly: true });
      }
      return;
    }
    const metals = [];
    METALS.forEach(function(m) {
      const col = show + '_' + metalColMap[m];
      const val = parseInt(p[col] || 0);
      if (val > 0) metals.push({ metal: m, count: val });
    });
    if (metals.length) awardCols.push({ name: show, metals: metals, iconOnly: false });
  });

  const OVERFLOW_THRESHOLD = 10;
  const OVERFLOW_HIDDEN = ['archive', 'caples', 'phnks'];
  let overflowCount = 0;
  let visibleCols = awardCols;
  if (awardCols.length > OVERFLOW_THRESHOLD) {
    visibleCols = awardCols.filter(function(col) {
      if (OVERFLOW_HIDDEN.includes(col.name)) { overflowCount++; return false; }
      return true;
    });
  }

  let iconsHTML;
  if (visibleCols.length) {
    let colsHTML = visibleCols.map(function(col) {
      const cells = col.iconOnly ? '' : col.metals.map(function(m) {
        const label = metalLabel(col.name, m.metal);
        return '<div class="award-cell ' + metalClass(m.metal) + '"><span class="cell-metal">' + label + '</span><span class="cell-count">' + m.count + '</span></div>';
      }).join('');
      const iconCell = '<div class="award-icon-cell"><img src="icons/' + col.name.toLowerCase() + '.png" alt="' + col.name + '" loading="lazy"></div>';
      return '<div class="award-col">' + cells + iconCell + '</div>';
    }).join('');

    if (overflowCount > 0) {
      colsHTML += '<div class="award-col award-col--overflow"><div class="award-icon-cell award-overflow-box">+' + overflowCount + '</div></div>';
    }
    iconsHTML = '<div class="award-icons">' + colsHTML + '</div>';
  } else {
    iconsHTML = '<div class="award-spacer"></div>';
  }

  let thumbInner = '';
  const thumb = (p.thumbnail || '').trim();
  if (thumb) {
    const isVideo = thumb.toLowerCase().endsWith('.mp4') || thumb.toLowerCase().endsWith('.webm');
    thumbInner = isVideo
      ? '<video src="thumbnail/' + thumb + '" autoplay loop muted playsinline></video>'
      : '<img src="thumbnail/' + thumb + '" alt="' + p.name + '" loading="lazy">';
  }

  const descHTML = (p['description thumb'] || p['descriptionthumb'] || p.description || '')
    ? '<p class="project-desc">' + (p['description thumb'] || p['descriptionthumb'] || p.description || '') + '</p>'
    : '';

  const mediaStr = (p.media || '').trim();
  let firstMedia = '';
  if (mediaStr) {
    const items = mediaStr.split('|').map(s => s.trim()).filter(Boolean);
    for (const item of items) {
      if (item.startsWith('vid:')) { firstMedia = item.slice(4).trim(); break; }
      if (item.startsWith('img:')) { firstMedia = 'media/' + item.slice(4).trim(); break; }
    }
  }

  a.innerHTML = iconsHTML +
    '<div class="project-thumb">' + thumbInner + '</div>' +
    '<div class="project-info">' +
      '<div class="project-info-top">' +
        '<div class="project-meta">' +
          '<p class="project-client">' + (p.client || '') + '</p>' +
          '<p class="project-name">' + p.name + '</p>' +
        '</div>' +
        '<div class="card-btns">' +
          '<span class="btn-view">View Full Project</span>' +
          (firstMedia ? '<button class="btn-quick" data-media=\'' + firstMedia + '\' data-name=\'' + p.name + '\' onclick="quickView(event,this)">Quick View</button>' : '') +
        '</div>' +
      '</div>' +
      descHTML +
    '</div>';

  return a;
}

function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

let currentView = 'full';
let currentSearch = '';

function moveSmileyEyes(view) {
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  if (!eyeL || !eyeR) return;
  const dx = view === 'full' ? -4 : 4;
  eyeL.setAttribute('cx', 13.5 + dx);
  eyeL.setAttribute('cy', 20);
  eyeR.setAttribute('cx', 27.5 + dx);
  eyeR.setAttribute('cy', 20);
}

function moveSmileyEyesDown() {
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  if (!eyeL || !eyeR) return;
  eyeL.setAttribute('cx', 13.5);
  eyeL.setAttribute('cy', 22.5);
  eyeR.setAttribute('cx', 27.5);
  eyeR.setAttribute('cy', 22.5);
}

function blinkSmiley() {
  const eyes = document.getElementById('eyes');
  if (!eyes) return;
  eyes.style.transform = 'scaleY(0.1)';
  eyes.style.transformOrigin = 'center';
  setTimeout(function() { eyes.style.transform = 'scaleY(1)'; }, 120);
}
setInterval(blinkSmiley, 3200 + Math.random() * 1500);

function setView(view) {
  currentView = view;
  document.getElementById('btn-full').classList.toggle('active', view === 'full');
  document.getElementById('btn-select').classList.toggle('active', view === 'select');
  moveSmileyEyes(view);
  document.getElementById('search-input').value = '';
  currentSearch = '';
  if (_projects) renderProjects(_projects);
}

function doSearch(query) {
  currentSearch = query.toLowerCase().trim();
  document.getElementById('btn-full').classList.toggle('active', !currentSearch && currentView === 'full');
  document.getElementById('btn-select').classList.toggle('active', !currentSearch && currentView === 'select');
  if (currentSearch) {
    moveSmileyEyesDown();
  } else {
    moveSmileyEyes(currentView);
  }
  if (_projects) renderProjects(_projects);
}

document.getElementById('btn-full').classList.add('active');
document.getElementById('search-input').addEventListener('input', function() { doSearch(this.value); });

loadProjects();

function getYouTubeId(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/))([\w-]{11})/);
  return m ? m[1] : null;
}

function quickView(e, btn) {
  e.preventDefault();
  e.stopPropagation();
  const media = btn.getAttribute('data-media');
  const name = btn.getAttribute('data-name');
  const box = document.getElementById('qv-media');
  document.getElementById('qv-title').textContent = name;
  document.getElementById('qv-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  const ytId = getYouTubeId(media);
  if (ytId) {
    box.innerHTML = '<iframe src="https://www.youtube.com/embed/' + ytId + '?autoplay=1&mute=0&rel=0&modestbranding=1&enablejsapi=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
  } else {
    box.innerHTML = '<img src="' + media + '" alt="' + name + '">';
  }
}

function closeQuickView(e) {
  if (e && e.target !== document.getElementById('qv-overlay') && !e.target.classList.contains('qv-close')) return;
  document.getElementById('qv-overlay').classList.remove('open');
  document.getElementById('qv-media').innerHTML = '';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeQuickView({ target: document.getElementById('qv-overlay') });
});
</script>

<div class="qv-overlay" id="qv-overlay" onclick="closeQuickView(event)">
  <div class="qv-box">
    <div class="qv-media" id="qv-media"></div>
    <div class="qv-title" id="qv-title"></div>
  </div>
  <button class="qv-close" onclick="closeQuickView()">✕ Close</button>
</div>
<script src="header.js"></script>
<script>
(function(){
  var SHEET_URL='https://script.google.com/macros/s/AKfycbyi4oh8EbDyicDxTQNuVZ43cf5o1D6E75wqpQ5bYaAO8yOwuaKN5aeQCqT9Qk3Vl7Ym/exec';
  var TIMER_MS=5000;
  var svg=document.getElementById('hero-svg');
  var bar=document.getElementById('hero-progress');
  var lastState={}, timer=null, prog=null, startTime=null, lastVote=null;

  function heroRender(){
    lastState=renderHeader(svg);
    // Match the wrap background to the SVG background — eliminates letterbox gaps
    var wrap=document.querySelector('.hero-header-wrap');
    if(wrap&&lastState.bgColor) wrap.style.background=lastState.bgColor;
    lastVote=null;
    document.getElementById('hero-btn-like').classList.remove('chosen');
    document.getElementById('hero-btn-dislike').classList.remove('chosen');
    startProgress();
  }

  function startProgress(){
    clearTimeout(timer);
    clearInterval(prog);
    startTime=Date.now();
    bar.style.width='0%';
    prog=setInterval(function(){
      var pct=Math.min(100,(Date.now()-startTime)/TIMER_MS*100);
      bar.style.width=pct+'%';
      if(pct>=100){
        clearInterval(prog);
        // Log vote to Sheet only now, with whatever was last selected
        if(lastVote){
          var s=lastState;
          fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({vote:lastVote,shape:s.shape||'',font:s.sfLabel||'',palette:s.palLabel||'',
              position:s.posLabel||'',vAlign:s.vAlign||'',base:s.s23||'',s1:s.s1||'',sA:s.sA||''})
          }).catch(function(){});
        }
        timer=setTimeout(heroRender,100);
      }
    },80);
  }

  window.heroVote=function(vote){
    // Toggle: clicking selected button deselects it
    var current=lastVote;
    lastVote= (current===vote) ? null : vote;
    document.getElementById('hero-btn-like').classList.toggle('chosen', lastVote==='like');
    document.getElementById('hero-btn-dislike').classList.toggle('chosen', lastVote==='dislike');
  };

  // Boot — render immediately, re-render on fonts without resetting timer
  heroRender();
  document.fonts.ready.then(function(){
    lastState=renderHeader(svg);
  });
})();
</script>
