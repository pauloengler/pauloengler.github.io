<script>
const ABOUT_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVn3Mw1D4qw9pc_ifibalqvnFv3rEf1xQ8eFNvXNY_t8UyH1c8_MkfTG8KkrczCnsyYaQo4lW2O0E3/pub?gid=1943812170&single=true&output=csv';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVn3Mw1D4qw9pc_ifibalqvnFv3rEf1xQ8eFNvXNY_t8UyH1c8_MkfTG8KkrczCnsyYaQo4lW2O0E3/pub?output=csv';
const METALS = ['gp','gold','silver','bronze','short'];
const METAL_FULL = { gp:'Grand Prix', gold:'Gold', silver:'Silver', bronze:'Bronze', short:'Shortlist' };
const DANDAD_FULL = { gp:'Black Pencil', gold:'Yellow Pencil', silver:'Graphite Pencil', bronze:'Wood Pencil', short:'Shortlist' };
const AWARD_NAMES = {
  ame:'AME', archive:"Lürzer's Archive", cannes:'Cannes Lions', caples:'Caples',
  clio:'Clio', cliohealth:'Clio Health', dandad:'D&AD', elojo:'El Ojo de Iberoamérica',
  fiap:'FIAP', lia:'London International Awards', loeries:'Loeries', lynx:'Dubai Lynx',
  madstars:'Mad Stars', newyork:'New York Festivals', one:'One Show',
  phnks:'Ad Forum PHNX', wark:'WARK', wave:'Wave Festival', webby:'Webby Awards', wpp:'WPP Cream'
};
const AWARD_KEYS = ['ame','archive','cannes','caples','clio','cliohealth','dandad','elojo','fiap','lia','loeries','lynx','madstars','newyork','one','phnks','wark','wave','webby','wpp'];
const metalColMap = { gp:'gp', gold:'g', silver:'s', bronze:'b', short:'sh' };

function parseCSV(text, skipFirst) {
  const result = [];
  const normalized = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  let pos = 0;
  function parseRow() {
    const cols = [];
    while (pos < normalized.length) {
      if (normalized[pos] === '"') {
        pos++;
        let val = '';
        while (pos < normalized.length) {
          if (normalized[pos]==='"' && normalized[pos+1]==='"') { val+='"'; pos+=2; }
          else if (normalized[pos]==='"') { pos++; break; }
          else { val+=normalized[pos++]; }
        }
        cols.push(val);
        if (normalized[pos]===',') pos++;
        else break;
      } else {
        let val = '';
        while (pos < normalized.length && normalized[pos]!==',' && normalized[pos]!=='\n') val+=normalized[pos++];
        cols.push(val.trim());
        if (normalized[pos]===',') pos++;
        else break;
      }
    }
    if (normalized[pos]==='\n') pos++;
    return cols;
  }
  if (skipFirst) parseRow();
  const headers = parseRow().map(h=>h.toLowerCase().trim());
  while (pos < normalized.length) {
    const cols = parseRow();
    if (cols.every(c=>!c)) continue;
    const obj = {};
    cols.forEach(function(val, i) {
      const key = (headers[i] && headers[i] !== '') ? headers[i] : 'col' + (i + 1);
      obj[key] = val || '';
    });
    result.push(obj);
  }
  return result;
}

function metalClass(m) {
  if (m==='gp') return 'metal-gp';
  if (m==='gold') return 'metal-gold';
  if (m==='silver') return 'metal-silver';
  if (m==='bronze') return 'metal-bronze';
  return 'metal-other';
}

function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function buildAwardsFromProjects(projects) {
  if (!projects || !projects.length) return '';
  const awardMap = {};
  projects.forEach(function(p) {
    AWARD_KEYS.forEach(function(show) {
      const hasAny = METALS.some(function(m) { return parseInt(p[show+'_'+metalColMap[m]]||0)>0; });
      if (!hasAny) return;
      if (!awardMap[show]) awardMap[show] = {metals:{gp:0,gold:0,silver:0,bronze:0,short:0},campaigns:[]};
      METALS.forEach(function(m) {
        const v = parseInt(p[show+'_'+metalColMap[m]]||0);
        if (v>0) awardMap[show].metals[m]+=v;
      });
      const campName = p.name||'';
      if (campName && !awardMap[show].campaigns.includes(campName)) awardMap[show].campaigns.push(campName);
    });
  });
  function total(k){ return METALS.reduce(function(s,m){ return s+awardMap[k].metals[m]; },0); }
  const keys = Object.keys(awardMap).filter(function(k){ return total(k)>0; })
    .sort(function(a,b){ return total(b)-total(a)||a.localeCompare(b); });
  if (!keys.length) return '';
  const itemsHTML = keys.map(function(key) {
    const award = awardMap[key];
    const isDandad = key==='dandad';
    const metalsHTML = METALS.filter(function(m){ return award.metals[m]>0; }).map(function(m) {
      const label = isDandad?(DANDAD_FULL[m]||m):(METAL_FULL[m]||m);
      return '<span class="award-about-pill"><span class="award-about-dot '+metalClass(m)+'">'+label+'</span> '+award.metals[m]+'</span>';
    }).join('');
    const campaignsHTML = award.campaigns.map(function(c) {
      return '<a href="project.html?id='+slugify(c)+'" class="award-campaign-link">'+c+'</a>';
    }).join('');
    const metalTotal = ['gp','gold','silver','bronze'].reduce(function(s,m){ return s+award.metals[m]; },0);
    return '<div class="award-about-item">'
      +'<div class="award-about-header">'
      +'<div class="award-about-icon"><img src="icons/'+key+'.png" alt="'+AWARD_NAMES[key]+'"></div>'
      +'<span class="award-about-name">'+(AWARD_NAMES[key]||key)+'</span>'
      +(metalTotal?'<span class="award-about-total">'+metalTotal+'</span>':'')
      +'</div>'
      +'<div class="award-about-metals">'+metalsHTML+'</div>'
      +(campaignsHTML?'<div class="award-about-campaigns">'+campaignsHTML+'</div>':'')
      +'</div>';
  }).join('');
  return '<div class="about-section"><p class="section-label">Awards</p><div class="awards-grid">'+itemsHTML+'</div></div>';
}

function buildAbout(rows, projects) {
  let html = '';
  const metalColMap2 = {gp:'gp',gold:'g',silver:'s',bronze:'b'};
  let totalAwards=0, totalCannes=0, totalGP=0;
  if (projects && projects.length) {
    projects.forEach(function(p) {
      AWARD_KEYS.forEach(function(show) {
        ['gp','g','s','b','sh'].forEach(function(m) {
          const v=parseInt(p[show+'_'+m]||0);
          if (v>0) totalAwards+=v;
          if (show==='cannes'&&m!=='sh'&&v>0) totalCannes+=v;
        });
      });
      const gp=parseInt(p['cannes_gp']||0);
      if (gp>0) totalGP+=gp;
    });
  }
  function applyTokens(str) {
    return str.replace(/\{\{total\}\}/g,totalAwards).replace(/\{\{cannes\}\}/g,totalCannes).replace(/\{\{gp\}\}/g,totalGP);
  }

  // Header
  const header = rows.find(r=>r.block==='header');
  if (header) {
    const sublines = rows.filter(r=>/^subline\d+$/.test(r.block)).sort((a,b)=>a.block.localeCompare(b.block,undefined,{numeric:true}));
    html += '<div class="about-header"><div class="about-header-left">'
      +'<p class="about-title">'+(header.col1||'')+'</p>'
      +'<h1 class="about-name">'+(header.col2||'')+'</h1>'
      +(sublines.length?'<div class="about-sublines">'+sublines.map(r=>'<p class="about-subline">'+applyTokens(r.col1||'')+'</p>').join('')+'</div>':'')
      +'</div></div>';
  }

  // Photo
  const photo = rows.find(r=>r.block==='photo');
  if (photo && photo.col1) html += '<div class="about-photo"><img src="'+photo.col1+'" alt="Paulo Engler"></div>';

  // Intro
  const intros = rows.filter(r=>r.block==='intro');
  if (intros.length) html += '<div class="about-section"><p class="section-label">About</p><div class="intro-text">'+intros.map(r=>'<p>'+(r.col1||'')+'</p>').join('')+'</div></div>';

  // Experience
  const experiences = rows.filter(r=>r.block==='experience');
  if (experiences.length) {
    html += '<div class="about-section"><p class="section-label">Experience</p><div class="experience-list">'
      +experiences.map(function(r) {
        const from=r.col2||'', until=r.col3||'';
        const years=from&&until?from+' – '+until:from||until;
        return '<div class="experience-row">'
          +'<span class="exp-company">'+(r.col1||'')+'</span>'
          +'<span class="exp-years">'+years+'</span>'
          +'<span class="exp-role">'+(r.col4||'')+'</span>'
          +'<span class="exp-location">'+(r.col5||'')+'</span>'
          +'</div>';
      }).join('')+'</div></div>';
  }

  // Jury
  const juryRows = rows.filter(r=>r.block==='jury');
  if (juryRows.length) {
    html += '<div class="about-section"><p class="section-label">Jury</p><div class="jury-list">'
      +juryRows.map(r=>'<div class="jury-row"><span class="exp-company">'+(r.col1||'')+'</span><span class="exp-years">'+(r.col2||'')+'</span></div>').join('')
      +'</div></div>';
  }

  // Expertise
  const expertiseRows = rows.filter(r=>r.block==='expertise');
  if (expertiseRows.length) {
    const tags=[];
    expertiseRows.forEach(function(r){ for(var i=1;i<=30;i++){ if(r['col'+i]) tags.push(r['col'+i]); } });
    html += '<div class="about-section"><p class="section-label">Expertise</p><div class="expertise-list">'+tags.map(t=>'<span class="expertise-tag">'+t+'</span>').join('')+'</div></div>';
  }

  // Clients
  const clientRows = rows.filter(r=>r.block==='clients');
  if (clientRows.length) {
    const clients=[];
    clientRows.forEach(function(r){ Object.keys(r).filter(k=>k.match(/^col\d+$/)).sort((a,b)=>parseInt(a.slice(3))-parseInt(b.slice(3))).forEach(function(k){ if(r[k]) clients.push(r[k]); }); });
    html += '<div class="about-section"><p class="section-label">Selected Clients</p><div class="clients-list">'+clients.map(c=>'<span class="client-tag">'+c+'</span>').join('')+'</div></div>';
  }

  // Awards — from projects sheet
  html += buildAwardsFromProjects(projects);

  // Contact
  const contact = rows.find(r=>r.block==='contact');
  if (contact) {
    html += '<div class="about-section"><p class="section-label">Contact</p><div class="contact-list">'
      +(contact.col1?'<div class="contact-item"><span class="contact-label">Email</span><a class="contact-value" href="mailto:'+contact.col1+'">'+contact.col1+'</a></div>':'')
      +(contact.col2?'<div class="contact-item"><span class="contact-label">Phone</span><a class="contact-value" href="tel:'+contact.col2.replace(/\s/g,'')+'">'+contact.col2+'</a></div>':'')
      +(contact.col3?'<div class="contact-item"><span class="contact-label">LinkedIn</span><a class="contact-value" href="'+contact.col3+'" target="_blank">'+contact.col3.replace('https://','')+'</a></div>':'')
      +(contact.col4?'<div class="contact-item"><span class="contact-label">Instagram</span><a class="contact-value" href="https://instagram.com/'+contact.col4+'" target="_blank">@'+contact.col4+'</a></div>':'')
      +(contact.col5?'<div class="contact-item"><span class="contact-label">Instagram</span><a class="contact-value" href="https://instagram.com/'+contact.col5+'" target="_blank">@'+contact.col5+'</a></div>':'')
      + '</div>'
      + '<button class="resume-dl-btn" onclick="generateResume(this)">&#8595; Download Resume</button>'
      + '</div>';
  }

  return html;
}

async function loadAbout() {
  try {
    const CACHE_AGE = 5 * 60 * 1000;
    async function fetchCSV(url, key) {
      const cached = sessionStorage.getItem(key);
      const cachedTime = sessionStorage.getItem(key+'_time');
      if (cached && cachedTime && (Date.now()-parseInt(cachedTime))<CACHE_AGE) return cached;
      const text = await (await fetch(url)).text();
      sessionStorage.setItem(key, text);
      sessionStorage.setItem(key+'_time', Date.now());
      return text;
    }
    const [aboutText, projectsText] = await Promise.all([
      fetchCSV(ABOUT_URL, 'about_v1'),
      fetchCSV(SHEET_URL, 'projects_v1')
    ]);
    const rows = parseCSV(aboutText, false);
    const projects = parseCSV(projectsText, true);
    window._aboutRows = rows;
    window._aboutProjects = projects;
    document.getElementById('about-content').innerHTML = buildAbout(rows, projects);
  } catch(err) {
    document.getElementById('about-content').innerHTML = '<div class="loading">Could not load content.</div>';
    console.error(err);
  }
}
loadAbout();

function generateResume(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
  setTimeout(function() {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
      const rows = window._aboutRows || [];
      const projects = window._aboutProjects || [];

      const W=210, H=297, ML=16, MR=16, MT=16, FOOTER=12;
      const cW = W-ML-MR;
      let y = MT;

      // Colour palette
      const BK  = [10,10,10];
      const MID = [100,100,100];
      const LT  = [170,170,170];
      const ACC = [10,10,10];   // accent = black for clean look

      // Award chip colours
      const CHIP = { gp:[10,10,10], g:[168,135,74], s:[154,175,168], b:[146,102,80], sh:[210,205,198] };
      const CHIPT= { gp:[247,244,238], g:[247,244,238], s:[247,244,238], b:[247,244,238], sh:[80,78,75] };

      function chk(n) {
        if (y+n > H-FOOTER-6) { doc.addPage(); y=MT; }
      }

      function hRule(weight, col) {
        doc.setDrawColor(...col);
        doc.setLineWidth(weight);
        doc.line(ML, y, W-MR, y);
      }

      function sectionLabel(t) {
        chk(12);
        y += 6;
        doc.setFont('helvetica','bold');
        doc.setFontSize(6.5);
        doc.setTextColor(...LT);
        doc.text(t.toUpperCase(), ML, y);
        y += 1.5;
        hRule(0.2, [220,218,214]);
        y += 4;
      }

      // ── AWARD TOTALS ──────────────────────────────────────────
      const AWARD_KEYS=['ame','archive','cannes','caples','clio','cliohealth','dandad','elojo','fiap','lia','loeries','lynx','madstars','newyork','one','phnks','wark','wave','webby','wpp'];
      let tot=0, can=0, gp=0;
      projects.forEach(function(p){
        AWARD_KEYS.forEach(function(s){
          ['gp','g','s','b','sh'].forEach(function(m){
            const v=parseInt(p[s+'_'+m]||0);
            if(v>0) tot+=v;
            if(s==='cannes'&&m!=='sh'&&v>0) can+=v;
          });
        });
        const g=parseInt(p['cannes_gp']||0); if(g>0) gp+=g;
      });
      function tok(s){ return s.replace(/\{\{total\}\}/g,tot).replace(/\{\{cannes\}\}/g,can).replace(/\{\{gp\}\}/g,gp); }

      // ── HEADER ────────────────────────────────────────────────
      // Black bar at top
      doc.setFillColor(...BK);
      doc.rect(0, 0, W, 38, 'F');

      const hdr = rows.find(r=>r.block==='header');
      const ct  = rows.find(r=>r.block==='contact');

      // Name
      doc.setFont('helvetica','bold');
      doc.setFontSize(22);
      doc.setTextColor(247,244,238);
      doc.text(hdr ? hdr.col2||'Paulo Engler' : 'Paulo Engler', ML, 16);

      // Title
      doc.setFont('helvetica','normal');
      doc.setFontSize(7.5);
      doc.setTextColor(180,178,172);
      doc.text(hdr ? (hdr.col1||'').toUpperCase() : '', ML, 23);

      // Nationality / age line
      doc.setFont('helvetica','normal');
      doc.setFontSize(7);
      doc.setTextColor(130,128,124);
      doc.text('Brazilian  ·  Based in Dubai, UAE  ·  41 years old', ML, 30);

      // Contact info right-aligned in header
      if (ct) {
        doc.setFont('helvetica','normal');
        doc.setFontSize(7);
        doc.setTextColor(180,178,172);
        const contactLines = [
          ct.col1||'',
          ct.col2||'',
          ct.col3 ? ct.col3.replace('https://','') : '',
          'pauloengler.com'
        ].filter(Boolean);
        let cy = 10;
        contactLines.forEach(function(line) {
          doc.text(line, W-MR, cy, { align:'right' });
          cy += 5;
        });
      }

      // Sublines as stats row below black bar
      y = 44;
      const subs = rows.filter(r=>/^subline\d+$/.test(r.block))
        .sort((a,b)=>a.block.localeCompare(b.block,undefined,{numeric:true}));
      if (subs.length) {
        doc.setFont('helvetica','normal');
        doc.setFontSize(7.5);
        doc.setTextColor(...MID);
        const statLine = subs.map(r=>tok(r.col1||'')).join('   ·   ');
        const wrapped = doc.splitTextToSize(statLine, cW);
        doc.text(wrapped, ML, y);
        y += wrapped.length * 4.5 + 2;
      }
      hRule(0.5, [10,10,10]);
      y += 6;

      // ── ABOUT ─────────────────────────────────────────────────
      const intros = rows.filter(r=>r.block==='intro');
      if (intros.length) {
        sectionLabel('About');
        doc.setFont('helvetica','normal');
        doc.setFontSize(8.5);
        doc.setTextColor(...BK);
        intros.forEach(function(r) {
          const ls = doc.splitTextToSize(r.col1||'', cW);
          chk(ls.length*4.8+4);
          doc.text(ls, ML, y);
          y += ls.length*4.8 + 3;
        });
      }

      // ── EXPERIENCE ────────────────────────────────────────────
      const exps = rows.filter(r=>r.block==='experience');
      if (exps.length) {
        sectionLabel('Experience');
        // Column widths: company 60mm | years 22mm | role 60mm | location rest
        const C1=ML, C2=ML+62, C3=ML+86, C4=ML+148;
        exps.forEach(function(r) {
          chk(9);
          const yrs = (r.col2&&r.col3) ? r.col2+' – '+r.col3 : (r.col2||r.col3||'');
          const role = r.col4||'';
          const loc  = r.col5||'';
          const company = (r.col1||'').toUpperCase();

          // Company name — bold
          doc.setFont('helvetica','bold');
          doc.setFontSize(8);
          doc.setTextColor(...BK);
          doc.text(company, C1, y);

          // Years
          doc.setFont('helvetica','normal');
          doc.setFontSize(7.5);
          doc.setTextColor(...MID);
          doc.text(yrs, C2, y);

          // Role
          doc.setTextColor(...BK);
          doc.text(role, C3, y);

          // Location
          doc.setTextColor(...LT);
          if (loc) doc.text(loc, C4, y);

          y += 7;
        });
      }

      // ── AWARDS ────────────────────────────────────────────────
      const AN = {
        ame:'AME', archive:"Lürzer's Archive", cannes:'Cannes Lions', caples:'Caples',
        clio:'Clio', cliohealth:'Clio Health', dandad:'D&AD', elojo:'El Ojo',
        fiap:'FIAP', lia:'LIA', loeries:'Loeries', lynx:'Dubai Lynx',
        madstars:'Mad Stars', newyork:'New York Festivals', one:'One Show',
        phnks:'PHNX', wark:'WARK', wave:'Wave Festival', webby:'Webby', wpp:'WPP Cream'
      };
      const MNAME = { gp:'Grand Prix', g:'Gold', s:'Silver', b:'Bronze', sh:'Shortlist' };
      const am = {};
      projects.forEach(function(p){
        AWARD_KEYS.forEach(function(s){
          ['gp','g','s','b','sh'].forEach(function(m){
            const v=parseInt(p[s+'_'+m]||0);
            if(v>0){
              if(!am[s]) am[s]={gp:0,g:0,s:0,b:0,sh:0,total:0};
              am[s][m]+=v; am[s].total+=v;
            }
          });
        });
      });
      const ak = Object.keys(am).sort((a,b)=>am[b].total-am[a].total);

      if (ak.length) {
        sectionLabel('Awards');
        // Two-column award layout
        const col1Awards = ak.filter((_,i)=>i%2===0);
        const col2Awards = ak.filter((_,i)=>i%2===1);
        const AW = (W-ML-MR)/2 - 4; // width of each column
        const startY = y;
        let yLeft = y, yRight = y;

        function drawAwardRow(show, xOff, yPos) {
          const aw = am[show];
          doc.setFont('helvetica','bold');
          doc.setFontSize(7.5);
          doc.setTextColor(...BK);
          doc.text((AN[show]||show).toUpperCase(), xOff, yPos);
          yPos += 4.5;

          // Medals as text (cleaner than pills at small size)
          const medals = [];
          [['gp','GP'],['g','Gold'],['s','Silver'],['b','Bronze'],['sh','Short']].forEach(function(pair){
            if(aw[pair[0]]>0) medals.push(pair[1]+' '+aw[pair[0]]);
          });
          doc.setFont('helvetica','normal');
          doc.setFontSize(7);
          doc.setTextColor(...MID);
          doc.text(medals.join('  '), xOff, yPos);
          yPos += 6;
          return yPos;
        }

        col1Awards.forEach(function(show, i) {
          chk(14);
          yLeft = drawAwardRow(show, ML, yLeft);
        });

        const midX = ML + AW + 8;
        col2Awards.forEach(function(show, i) {
          yRight = drawAwardRow(show, midX, startY + i * 11);
        });

        y = Math.max(yLeft, startY + col2Awards.length * 11) + 2;
      }

      // ── EXPERTISE ─────────────────────────────────────────────
      const er = rows.filter(r=>r.block==='expertise');
      if (er.length) {
        sectionLabel('Expertise');
        const tags = [];
        er.forEach(r=>Object.keys(r).filter(k=>/^col\d+$/.test(k)).sort().forEach(k=>{if(r[k])tags.push(r[k]);}));
        doc.setFont('helvetica','normal');
        doc.setFontSize(8);
        doc.setTextColor(...MID);
        const tl = doc.splitTextToSize(tags.join('  ·  '), cW);
        chk(tl.length*5+4);
        doc.text(tl, ML, y);
        y += tl.length*5 + 3;
      }

      // ── CLIENTS ───────────────────────────────────────────────
      const cr = rows.filter(r=>r.block==='clients');
      if (cr.length) {
        sectionLabel('Selected Clients');
        const cl = [];
        cr.forEach(r=>Object.keys(r).filter(k=>/^col\d+$/.test(k)).sort().forEach(k=>{if(r[k])cl.push(r[k]);}));
        // Ensure Etihad Airways is in the list
        if (!cl.some(c=>c.toLowerCase().includes('etihad'))) cl.push('Etihad Airways');
        doc.setFont('helvetica','normal');
        doc.setFontSize(8);
        doc.setTextColor(...MID);
        const cll = doc.splitTextToSize(cl.join('  ·  '), cW);
        chk(cll.length*5+4);
        doc.text(cll, ML, y);
        y += cll.length*5 + 3;
      }

      // ── JURY ──────────────────────────────────────────────────
      const jury = rows.filter(r=>r.block==='jury');
      if (jury.length) {
        sectionLabel('Jury');
        jury.forEach(function(r) {
          chk(8);
          doc.setFont('helvetica','bold');
          doc.setFontSize(8);
          doc.setTextColor(...BK);
          doc.text(r.col1||'', ML, y);
          doc.setFont('helvetica','normal');
          doc.setFontSize(7.5);
          doc.setTextColor(...MID);
          doc.text(r.col2||'', ML+100, y);
          y += 7;
        });
      }

      // ── FOOTER ON EVERY PAGE ──────────────────────────────────
      const now = new Date();
      const stamp = 'pauloengler.com  ·  pauloengler@gmail.com  ·  Generated '+
        now.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      const pages = doc.getNumberOfPages();
      for (let i=1; i<=pages; i++) {
        doc.setPage(i);
        // Footer line
        doc.setDrawColor(...LT);
        doc.setLineWidth(0.2);
        doc.line(ML, H-FOOTER, W-MR, H-FOOTER);
        doc.setFont('helvetica','normal');
        doc.setFontSize(6);
        doc.setTextColor(...LT);
        doc.text(stamp, ML, H-FOOTER+4);
        doc.text(i+' / '+pages, W-MR, H-FOOTER+4, { align:'right' });
      }

      const fn='PauloEngler_Resume_'+now.getFullYear()+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2)+'.pdf';
      doc.save(fn);

    } catch(e) { console.error(e); alert('Could not generate PDF: '+e.message); }
    if (btn) { btn.disabled=false; btn.textContent='↓ Download Resume'; }
  }, 50);
}
</script>
</body>
</html>
