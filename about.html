<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paulo Engler — About</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #FFFFFF; color: #0A0A0A; font-family: 'JetBrains Mono', monospace; font-weight: 400; min-height: 100vh; }
    .site { display: flex; flex-direction: column; background: #FFFFFF; min-height: 100vh; }

    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #FFFFFF; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #E5E5E5; }
    .nav-left, .nav-right { display: flex; gap: 20px; }
    .nav-left a, .nav-right a { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 11px; letter-spacing: 0.02em; text-transform: uppercase; color: #999999; text-decoration: none; transition: color 0.2s; }
    .nav-left a:hover, .nav-right a:hover { color: #0A0A0A; }

    .about-hero { padding: 64px 40px 48px; border-bottom: 1px solid #E5E5E5; }
    .about-label { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; color: #999999; margin-bottom: 12px; }
    .about-name { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: clamp(28px, 4vw, 52px); color: #0A0A0A; line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 8px; }
    .about-role { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 13px; color: #999999; letter-spacing: 0.02em; }

    .about-section { padding: 40px; border-bottom: 1px solid #E5E5E5; }
    .section-label { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: #999999; margin-bottom: 20px; }
    .about-intro { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 15px; color: #333333; line-height: 1.75; max-width: 720px; }
    .about-intro p { margin-top: 14px; }
    .about-intro p:first-child { margin-top: 0; }

    .experience-list { display: flex; flex-direction: column; gap: 0; }
    .experience-row { display: grid; grid-template-columns: 1fr 120px 180px 200px; gap: 16px; padding: 14px 0; border-bottom: 1px solid #E5E5E5; align-items: baseline; }
    .experience-row:first-child { border-top: 1px solid #E5E5E5; }
    .exp-company { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; color: #0A0A0A; }
    .exp-years { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 11px; color: #999999; }
    .exp-role { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 11px; color: #555555; }
    .exp-location { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 11px; color: #999999; text-align: right; }

    .jury-list { display: flex; flex-direction: column; gap: 0; }
    .jury-row { display: grid; grid-template-columns: 1fr 100px; gap: 16px; padding: 14px 0; border-bottom: 1px solid #E5E5E5; align-items: baseline; }
    .jury-row:first-child { border-top: 1px solid #E5E5E5; }
    .jury-name { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; color: #0A0A0A; }
    .jury-year { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 11px; color: #999999; text-align: right; }

    .tags-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 10px; letter-spacing: 0.02em; text-transform: uppercase; color: #0A0A0A; border: 1px solid #0A0A0A; padding: 6px 12px; }

    .clients-wrap { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; color: #555555; line-height: 1.8; }

    .contact-list { display: flex; flex-direction: column; gap: 12px; }
    .contact-row { display: flex; gap: 16px; align-items: center; }
    .contact-label { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; color: #999999; width: 80px; flex-shrink: 0; }
    .contact-value { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 12px; color: #0A0A0A; text-decoration: none; }
    .contact-value:hover { color: #999999; }

    footer { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #0A0A0A; margin-top: auto; }
    .footer-left, .footer-right { display: flex; gap: 20px; }
    .footer-left a, .footer-right a { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 11px; letter-spacing: 0.02em; text-transform: uppercase; color: rgba(255,255,255,0.4); text-decoration: none; transition: color 0.2s; }
    .footer-left a:hover, .footer-right a:hover { color: #FFFFFF; }

    .loading { padding: 80px 40px; text-align: center; font-size: 11px; letter-spacing: 0.02em; text-transform: uppercase; color: #999999; }

    @media (max-width: 600px) {
      nav, .about-hero, .about-section, footer { padding-left: 20px; padding-right: 20px; }
      .experience-row { grid-template-columns: 1fr 1fr; }
      .exp-role, .exp-location { display: none; }
    }
  </style>
</head>
<body>
<div class="site">

<nav>
  <div class="nav-left">
    <a href="mailto:pauloengler@gmail.com">pauloengler@gmail.com</a>
    <a href="tel:+971556690393">+971 55 6690393</a>
  </div>
  <div class="nav-right">
    <a href="index.html">Work</a>
    <a href="about.html">About</a>
  </div>
</nav>

<div id="about-content"><p class="loading">Loading...</p></div>

<footer>
  <div class="footer-left">
    <a href="mailto:pauloengler@gmail.com">pauloengler@gmail.com</a>
    <a href="tel:+971556690393">+971 55 6690393</a>
  </div>
  <div class="footer-right">
    <a href="index.html">Work</a>
    <a href="about.html">About</a>
  </div>
</footer>

</div>
<script>
const ABOUT_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVn3Mw1D4qw9pc_ifibalqvnFv3rEf1xQ8eFNvXNY_t8UyH1c8_MkfTG8KkrczCnsyYaQo4lW2O0E3/pub?gid=1943812170&single=true&output=csv';

function parseCSV(text) {
  const rows = [];
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  let headers = null;
  for (const line of lines) {
    if (!line.trim()) continue;
    const cells = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cells.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cells.push(cur.trim());
    if (!headers) { headers = cells.map(h => h.toLowerCase().trim()); continue; }
    const row = {};
    headers.forEach((h, i) => { row[h] = (cells[i] || '').replace(/^"|"$/g,'').trim(); });
    rows.push(row);
  }
  return rows;
}

function rowsByBlock(rows, block) {
  return rows.filter(r => (r.block||'').toLowerCase().trim() === block);
}
function firstByBlock(rows, block) {
  return rowsByBlock(rows, block)[0] || {};
}

function render(rows) {
  const header = firstByBlock(rows, 'header');
  const intros = rowsByBlock(rows, 'intro');
  const experiences = rowsByBlock(rows, 'experience');
  const juries = rowsByBlock(rows, 'jury');
  const expertise = rowsByBlock(rows, 'expertise');
  const clients = firstByBlock(rows, 'clients');
  const contact = firstByBlock(rows, 'contact');

  const clientList = Object.values(clients).filter((v,i) => i > 0 && v).join(' · ');

  const allExpertise = [];
  expertise.forEach(r => {
    Object.values(r).slice(1).filter(v=>v).forEach(v => allExpertise.push(v));
  });

  let html = '';

  // Hero
  html += `<div class="about-hero">
    <p class="about-label">About</p>
    <h1 class="about-name">${header.col1 || 'Paulo Engler'}</h1>
    <p class="about-role">${header.col2 || ''}</p>
  </div>`;

  // Intro
  if (intros.length) {
    html += `<div class="about-section">
      <p class="section-label">Introduction</p>
      <div class="about-intro">${intros.map(r=>`<p>${r.col1||''}</p>`).join('')}</div>
    </div>`;
  }

  // Experience
  if (experiences.length) {
    html += `<div class="about-section">
      <p class="section-label">Experience</p>
      <div class="experience-list">
        ${experiences.map(r => `<div class="experience-row">
          <span class="exp-company">${r.col1||''}</span>
          <span class="exp-years">${r.col2||''}${r.col3?' – '+r.col3:''}</span>
          <span class="exp-role">${r.col4||''}</span>
          <span class="exp-location">${r.col5||''}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }

  // Jury
  if (juries.length) {
    html += `<div class="about-section">
      <p class="section-label">Jury</p>
      <div class="jury-list">
        ${juries.map(r => `<div class="jury-row">
          <span class="jury-name">${r.col1||''}</span>
          <span class="jury-year">${r.col2||''}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }

  // Expertise
  if (allExpertise.length) {
    html += `<div class="about-section">
      <p class="section-label">Expertise</p>
      <div class="tags-wrap">${allExpertise.map(e=>`<span class="tag">${e}</span>`).join('')}</div>
    </div>`;
  }

  // Clients
  if (clientList) {
    html += `<div class="about-section">
      <p class="section-label">Clients</p>
      <p class="clients-wrap">${clientList}</p>
    </div>`;
  }

  // Contact
  if (contact.col1) {
    html += `<div class="about-section">
      <p class="section-label">Contact</p>
      <div class="contact-list">
        ${contact.col1 ? `<div class="contact-row"><span class="contact-label">Email</span><a class="contact-value" href="mailto:${contact.col1}">${contact.col1}</a></div>` : ''}
        ${contact.col2 ? `<div class="contact-row"><span class="contact-label">Phone</span><a class="contact-value" href="tel:${contact.col2}">${contact.col2}</a></div>` : ''}
        ${contact.col3 ? `<div class="contact-row"><span class="contact-label">LinkedIn</span><a class="contact-value" href="${contact.col3}" target="_blank">${contact.col3.replace('https://','')}</a></div>` : ''}
        ${contact.col4 ? `<div class="contact-row"><span class="contact-label">Instagram</span><a class="contact-value" href="https://instagram.com/${contact.col4}" target="_blank">@${contact.col4}</a></div>` : ''}
      </div>
    </div>`;
  }

  document.getElementById('about-content').innerHTML = html;
}

fetch(ABOUT_URL)
  .then(r => r.text())
  .then(text => render(parseCSV(text)))
  .catch(() => {
    document.getElementById('about-content').innerHTML = '<p class="loading">Could not load content.</p>';
  });
</script>
</body>
</html>
