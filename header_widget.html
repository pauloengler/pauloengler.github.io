<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0A0A0A;padding:16px;font-family:'Unbounded',sans-serif;}
.header-chip{position:relative;width:100%;aspect-ratio:800/320;border-radius:14px;overflow:hidden;}
.header-chip svg{position:absolute;inset:0;width:100%;height:100%;}
.progress-bar{position:absolute;bottom:0;left:0;height:15px;background:#926650;width:0%;z-index:10;}
.vote-section{margin-top:10px;background:#F7F4EE;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:16px;}
.vote-text{font-family:'Unbounded',sans-serif;font-weight:700;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#0A0A0A;line-height:1.7;flex:1;min-width:0;}
.vote-btns{display:flex;gap:10px;flex-shrink:0;align-items:center;}
.vote-cta{flex:0 0 88px;width:88px;overflow:hidden;display:flex;align-items:center;animation:blink-cta 1s ease-in-out infinite;}
.vote-cta svg{display:block;width:88px;height:36px;min-width:88px;max-width:88px;}
.vote-btn{width:44px;height:44px;border-radius:50%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s;flex-shrink:0;}
.vote-btn svg{width:44px;height:44px;min-width:44px;max-width:44px;display:block;flex-shrink:0;}
.vote-btn:hover{transform:scale(1.1);}
.vote-btn.chosen{box-shadow:0 0 0 3px #0A0A0A;}
@keyframes blink-cta{0%,100%{opacity:1;transform:translateX(0);}50%{opacity:.25;transform:translateX(5px);}}
.dev-panel{margin-top:8px;background:#1a1a1a;border-radius:14px;padding:14px 16px;}
.dev-panel summary{font-family:monospace;font-size:10px;color:#555;cursor:pointer;list-style:none;outline:none;}
.dev-panel summary::-webkit-details-marker{display:none;}
.dev-inner{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
.fb-row{display:flex;gap:8px;align-items:center;}
.fb-lbl{font-size:10px;color:#555;}
.fb-btn{font-size:10px;padding:4px 14px;border-radius:6px;border:0.5px solid #444;background:#2a2a2a;color:#aaa;cursor:pointer;font-weight:600;}
.fb-btn.yes.chosen{background:#1a3d1a;border-color:#3a7a3a;color:#7dda7d;}
.fb-btn.no.chosen{background:#3d1a1a;border-color:#7a3a3a;color:#da7d7d;}
.fb-btn.yes:hover{background:#1a3d1a;color:#7dda7d;}
.fb-btn.no:hover{background:#3d1a1a;color:#da7d7d;}
.notes{width:100%;background:#242424;border:0.5px solid #333;border-radius:6px;color:#aaa;font-family:monospace;font-size:10px;padding:6px 10px;resize:none;outline:none;}
.inf{font-family:monospace;font-size:9px;color:#444;flex:1;}
</style>
</head>
<body>

<div class="header-chip">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="progress-bar" id="prog"></div>
</div>

<div class="vote-section">
  <p class="vote-text">This header is AI-generated.<br>Your reaction helps improve future designs.</p>
  <div class="vote-btns">
    <div class="vote-cta">
      <svg width="88" height="36" viewBox="0 0 88 36" fill="none">
        <path d="M6 0 Q0 0 0 6 L0 30 Q0 36 6 36 L58 36 C62 36 66 32 72 28 L84 20 Q88 18 84 16 L72 8 C66 4 62 0 58 0 Z" fill="#0A0A0A"/>
        <text x="31" y="23" text-anchor="middle" font-family="Unbounded,sans-serif" font-weight="700" font-size="12" fill="#F7F4EE">CLICK</text>
      </svg>
    </div>
    <button class="vote-btn" id="btn-like" onclick="castVote('like')">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><circle cx="22" cy="22" r="22" fill="#4CAF50"/><circle cx="16" cy="18" r="2" fill="white"/><circle cx="28" cy="18" r="2" fill="white"/><path d="M14 26 Q22 34 30 26" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
    </button>
    <button class="vote-btn" id="btn-dislike" onclick="castVote('dislike')">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><circle cx="22" cy="22" r="22" fill="#E53935"/><circle cx="16" cy="18" r="2" fill="white"/><circle cx="28" cy="18" r="2" fill="white"/><path d="M14 30 Q22 22 30 30" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/></svg>
    </button>
  </div>
</div>

<details class="dev-panel">
  <summary>⚙ Dev panel</summary>
  <div class="dev-inner">
    <div class="fb-row">
      <span class="fb-lbl">Verdict:</span>
      <button class="fb-btn yes" onclick="devVote('yes')">✓ Yes</button>
      <button class="fb-btn no" onclick="devVote('no')">✗ No</button>
      <span class="inf" id="inf"></span>
    </div>
    <textarea class="notes" id="notes" rows="2" placeholder="Notes…"></textarea>
  </div>
</details>

const ACCENTS=['#E8312A','#1E5FE8','#FFD400','#1AA84B','#FF6B00','#9B27D0','#00B8D4'];
function pickAccent(){return pick(ACCENTS);}
const ANCHORS=['L','C','R'];
const SP=14,GAP_MIN=0,GAP_MAX=8,SZ_FLOOR=18;

const MEASURE_SAFETY=1.08; // 8% buffer — display fonts often wider than canvas measures

// ─── Helpers ──────────────────────────────────────────────────────────────────
const _cv=document.createElement('canvas'),_cx=_cv.getContext('2d');
function mW(t,sz){_cx.font=`700 ${sz}px Unbounded,sans-serif`;return _cx.measureText(t).width*MEASURE_SAFETY;}
function mWf(t,sz,f,w,s){_cx.font=`${s==='italic'?'italic ':''}${w} ${sz}px ${f.replace(/"/g,'').split(',')[0]},sans-serif`;return _cx.measureText(t).width*MEASURE_SAFETY;}
function rndInt(a,b){return Math.floor(a+Math.random()*(b-a+1));}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function weightedPick(items,key='w'){
  const total=items.reduce((s,x)=>s+(x[key]||1),0);
  let r=Math.random()*total;
  for(const x of items){r-=(x[key]||1);if(r<=0)return x;}
  return items[0];
}

// ─── Background palettes — mostly white/black/grey, no warm/cool tints ───────
const BG_PALETTES=[
  {bg:'#FFFFFF',label:'white',       dark:false,w:6},
  {bg:'#1A1A1A',label:'black',       dark:true, w:3},
  {bg:'#0A0A0A',label:'true-black',  dark:true, w:3},
];

function bgTextColors(pal){
  if(pal.dark) return{col:'#FFFFFF',warm:'#FFFFFF',cold:'#FFFFFF'};
  return{col:'#0A0A0A',warm:'#0A0A0A',cold:'#0A0A0A'};

// ─── Textures ─────────────────────────────────────────────────────────────────
function tc(dark,op){return dark?`rgba(255,255,255,${op})`:`rgba(0,0,0,${op})`;}
function texStripes(bg,dark){
  const op=rnd(0.06,0.14).toFixed(2),gap=rndInt(12,28),angle=pick([0,30,45,60,90,135]),sw=rndInt(1,3);
  return`<defs><pattern id="tex" patternUnits="userSpaceOnUse" width="${gap}" height="${gap}" patternTransform="rotate(${angle})"><line x1="0" y1="0" x2="0" y2="${gap}" stroke="${tc(dark,op)}" stroke-width="${sw}"/></pattern></defs><rect width="${VW}" height="${VH}" fill="${bg}"/><rect width="${VW}" height="${VH}" fill="url(#tex)"/>`;
}
function texDots(bg,dark){
  const op=rnd(0.07,0.16).toFixed(2),gap=rndInt(14,30),r=rndInt(1,4);
  return`<defs><pattern id="tex" patternUnits="userSpaceOnUse" width="${gap}" height="${gap}"><circle cx="${gap/2}" cy="${gap/2}" r="${r}" fill="${tc(dark,op)}"/></pattern></defs><rect width="${VW}" height="${VH}" fill="${bg}"/><rect width="${VW}" height="${VH}" fill="url(#tex)"/>`;
}
function texGrid(bg,dark){
  const op=rnd(0.06,0.12).toFixed(2),gap=rndInt(20,40);
  return`<defs><pattern id="tex" patternUnits="userSpaceOnUse" width="${gap}" height="${gap}"><path d="M${gap} 0 L0 0 0 ${gap}" fill="none" stroke="${tc(dark,op)}" stroke-width="1"/></pattern></defs><rect width="${VW}" height="${VH}" fill="${bg}"/><rect width="${VW}" height="${VH}" fill="url(#tex)"/>`;
}
function texWaves(bg,dark){
  const op=rnd(0.08,0.16).toFixed(2),amp=rndInt(4,10),freq=rndInt(24,40);
  let path='';
  for(let y=-amp;y<VH+freq;y+=freq){
    path+=`M0,${y} `;
    for(let x=0;x<=VW+8;x+=8){path+=`${x},${y+Math.sin(x/freq*Math.PI*2)*amp} `;}
  }
  return`<rect width="${VW}" height="${VH}" fill="${bg}"/><path d="${path}" fill="none" stroke="${tc(dark,op)}" stroke-width="1.5"/>`;
}
// ─── Gradient backgrounds ─────────────────────────────────────────────────────
// Pairs of BG_PALETTE colors that work together as gradients — all greyscale
const GRADIENT_PAIRS=[
  ['#1A1A1A','#0A0A0A'],
];

function makeGradientBg(){
  const pair=pick(GRADIENT_PAIRS);
  const angle=rndInt(0,90); // 0=horizontal→, 90=vertical↓
  const rad=angle*Math.PI/180;
  // SVG linearGradient uses x1,y1,x2,y2 in 0-1 space
  const x1=0.5-Math.cos(rad)*0.5, y1=0.5-Math.sin(rad)*0.5;
  const x2=0.5+Math.cos(rad)*0.5, y2=0.5+Math.sin(rad)*0.5;
  const id='grad'+Math.floor(Math.random()*99999);
  // Determine if overall tone is dark (second stop is dark)
  const palEntry=BG_PALETTES.find(p=>p.bg===pair[1])||BG_PALETTES.find(p=>p.bg===pair[0])||BG_PALETTES[0];
  const inner=`<defs><linearGradient id="${id}" x1="${x1.toFixed(3)}" y1="${y1.toFixed(3)}" x2="${x2.toFixed(3)}" y2="${y2.toFixed(3)}" gradientUnits="objectBoundingBox"><stop offset="0%" stop-color="${pair[0]}"/><stop offset="100%" stop-color="${pair[1]}"/></linearGradient></defs><rect width="${VW}" height="${VH}" fill="url(#${id})"/>`;
  return{inner, bg:pair[0], dark:palEntry.dark, label:`grad-${angle}`, texLabel:'gradient', textCols:bgTextColors(palEntry)};
}

  {id:'dots',   w:3,fn:texDots},
  {id:'grid',   w:2,fn:texGrid},
  {id:'waves',  w:2,fn:texWaves},
  {id:'none',   w:3,fn:(bg)=>`<rect width="${VW}" height="${VH}" fill="${bg}"/>`},
];

  return{inner,bg:pal.bg,dark:pal.dark,label:pal.label,texLabel:tex.id,textCols:bgTextColors(pal)};
}

  senior:'header_fonts_seen_senior_v1',
  amp:'header_fonts_seen_amp_v1',
  body:'header_fonts_seen_body_v1',
};

function fontEntryFromName(name){
  const clean=(name||'').trim();
  if(!clean) return null;
  const gf=clean.replace(/\s+/g,'+');
  return{f:`"${clean}",sans-serif`,w:'400',s:'normal',label:clean,gf};
}

function getSeen(key){
  try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ return []; }
}
function markSeen(key,labels){
  try{
    let seen=getSeen(key).concat(labels);
    seen=[...new Set(seen)];
    localStorage.setItem(key,JSON.stringify(seen));
  }catch(e){}
}

function pickSessionFonts(pool,key){
  if(!pool.length) return [];
  const seen=getSeen(key);
  let unseen=pool.filter(f=>!seen.includes(f.label));
  if(unseen.length===0){
    try{ localStorage.removeItem(key); }catch(e){}
    unseen=pool.slice();
  } else if(unseen.length<SESSION_SIZE){
    const filler=shuffle(pool.filter(f=>seen.includes(f.label)));
    unseen=unseen.concat(filler);
  }
  const picked=shuffle(unseen).slice(0,Math.min(SESSION_SIZE,pool.length));
  markSeen(key,picked.map(f=>f.label));
  return picked;
}

function injectFontLink(allFonts){
  if(!allFonts.length) return;
  const existing=document.querySelector('link[data-header-fonts]');
  if(existing) existing.remove();
  // Dedup across all 3 pools so we don't request the same family twice
  const seenLabels=new Set();
  const unique=allFonts.filter(f=>{
    if(seenLabels.has(f.label)) return false;
    seenLabels.add(f.label);
    return true;
  });
  const families=unique.map(f=>f.gf).join('&family=');
  const lnk=document.createElement('link');
  lnk.rel='stylesheet';
  lnk.setAttribute('data-header-fonts','1');
  lnk.href=`https://fonts.googleapis.com/css2?family=${families}&display=swap`;
  document.head.appendChild(lnk);
}

// Start with the static fallback pool (used for all 3 roles) so the header renders immediately
let SENIOR_FONTS = pickSessionFonts(ALL_FONTS,SEEN_KEYS.senior);
let AMP_FONTS     = pickSessionFonts(ALL_FONTS,SEEN_KEYS.amp);
let BODY_FONTS    = []; // empty by default — CD/HoA use Unbounded unless the sheet provides a column
injectFontLink(SENIOR_FONTS.concat(AMP_FONTS).concat(BODY_FONTS));

// Fetch the 3-column spreadsheet in the background; swap pools in once loaded
(function loadSheetFonts(){
  fetch(FONTS_SHEET_URL,{mode:'cors',credentials:'omit',redirect:'follow'})
    .then(r=>r.text())
    .then(text=>{
      const lines=text.replace(/\r\n/g,'\n').split('\n');
      const rows=lines.slice(1); // skip header row
      const colA=[],colB=[],colC=[];
      rows.forEach(line=>{
        // Simple CSV split — font names shouldn't contain commas, so this is safe
        const cells=line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
        const a=fontEntryFromName(cells[0]); if(a) colA.push(a);
        const b=fontEntryFromName(cells[1]); if(b) colB.push(b);
        const c=fontEntryFromName(cells[2]); if(c) colC.push(c);
      });
      if(colA.length>=3) SENIOR_FONTS=pickSessionFonts(colA,SEEN_KEYS.senior);
      if(colB.length>=3) AMP_FONTS=pickSessionFonts(colB,SEEN_KEYS.amp);
      if(colC.length>=3) BODY_FONTS=pickSessionFonts(colC,SEEN_KEYS.body);
      injectFontLink(SENIOR_FONTS.concat(AMP_FONTS).concat(BODY_FONTS));
    })
    .catch(()=>{ /* sheet unavailable — keep using ALL_FONTS fallback for Senior/& */ });
})();

// ─── Layout helpers ───────────────────────────────────────────────────────────
function mkLayout(anchor,w){
  if(anchor==='L')return{x:PAD,ta:'start',L:PAD,R:PAD+w};
  if(anchor==='R')return{x:VW-PAD,ta:'end',L:VW-PAD-w,R:VW-PAD};
  return{x:VW/2,ta:'middle',L:VW/2-w/2,R:VW/2+w/2};
}
function clamp(l){
  let{x,ta,L,R}=l;
  if(L<PAD){const d=PAD-L;x+=d;L+=d;R+=d;}
  if(R>VW-PAD){const d=R-(VW-PAD);x-=d;L-=d;R-=d;}
  return{...l,x,L,R};
}
// Fit font size so text never exceeds available width for its anchor position
function fitSzW(t,sz){const mxW=VW-PAD*2;while(sz>SZ_FLOOR&&mW(t,sz)>mxW)sz--;return Math.max(SZ_FLOOR,sz);}
function fitSzWf(t,sz,f,w,s){const mxW=VW-PAD*2;while(sz>SZ_FLOOR&&mWf(t,sz,f,w,s)>mxW)sz--;return Math.max(SZ_FLOOR,sz);}
function ampPlace(va,adjB,adjS,sA){
  const adjTop=adjB-adjS;
  if(va==='top')return{yA:adjTop+sA};
  if(va==='bottom')return{yA:adjB};
  return{yA:adjTop+adjS/2+sA/2};
}

// ─── No-repeat memory ─────────────────────────────────────────────────────────
const recentShapes=[],recentFonts=[],recentAmpFonts=[],recentBodyFonts=[];
const RECENT_MEM=7;
function pickNoRecent(pool,history,key){
  const fresh=pool.filter(x=>!history.includes(x[key]));
  const choice=fresh.length?weightedPick(fresh):weightedPick(pool);
  history.push(choice[key]);
  if(history.length>RECENT_MEM)history.shift();
  return choice;
}

// ─── Generator ────────────────────────────────────────────────────────────────
let _seq=0;
function generate(){
  _seq++;
  const t1='Senior',t2='Creative Director',t3='Head of Art',tA='&';

  const sf=pickNoRecent(SENIOR_FONTS.length?SENIOR_FONTS:ALL_FONTS,recentFonts,'label');
  const ampPool=AMP_FONTS.length?AMP_FONTS:ALL_FONTS;
  // 50% chance & shares the same family as Senior (when present in its own pool), otherwise picks independently
  const afPool=Math.random()<0.5 && ampPool.some(f=>f.label===sf.label)
    ? ampPool
    : ampPool.filter(f=>f.label!==sf.label);
  const af=pickNoRecent(afPool.length?afPool:ampPool,recentAmpFonts,'label');

  // CD/HoA body font: from the spreadsheet's 3rd column if provided, else falls back to Unbounded
  const bf = BODY_FONTS.length ? pickNoRecent(BODY_FONTS,recentBodyFonts,'label') : null;

  const bgData=makeBackground();
  const BG=bgData.bg;
  const TC=bgData.textCols;

  // Shape color: mostly a bright pure accent (the one moment of real color),
  // occasionally just the contrast color (monochrome shape)
  const useAccentShape = Math.random()<0.75;
  const accentColor = pickAccent();
  const shapecol = useAccentShape ? accentColor : TC.col;
  const strokecol=TC.col;

  // Text palette: ranges from all-monochrome to multiple lines in different accents.
  // Roll how many lines get color: 0 (mono), 1, or 2+ — weighted toward fewer.
  const D=TC.col;
  const colorCount=weightedPick([
    {n:0,w:4},  // fully monochrome
    {n:1,w:4},  // one accent line
    {n:2,w:2},  // two accent lines, possibly different colors
  ],'w').n;
  const c=[D,D,D];
  if(colorCount>0){
    const lineIdxs=shuffle([0,1,2]).slice(0,colorCount);
    lineIdxs.forEach(i=>{ c[i]=Math.random()<0.5?accentColor:pickAccent(); });
  }
  const pal={c};

  const shapeObj=pickNoRecent(SHAPES,recentShapes,'id');
  let mode=pickMode();
  if(shapeObj.cat==='star'&&mode==='stroke'&&Math.random()<0.7)mode='filled';

  const maxFitCD=fitSzW(t2,999);
  const base=rndInt(36,Math.min(maxFitCD,100));
  const vR=RATIOS.filter(r=>Math.round(base*r)>=SZ_FLOOR&&Math.round(base*r)<=base*2);
  const vRBig=RATIOS.filter(r=>Math.round(base*r)>=SZ_FLOOR); // no upper cap — allows much bigger
  let s23=base;
  // Senior: occasionally much bigger (20% chance to draw from uncapped ratios)
  const s1Ratios = Math.random()<0.2 ? vRBig : vR;
  let s1=fitSzWf(t1,Math.round(base*pick(s1Ratios)),sf.f,sf.w,sf.s);
  // & : more frequently much bigger (35% chance) — the most expressive element
  const sARatios = Math.random()<0.35 ? vRBig : vR;
  let sA=fitSzWf(tA,Math.round(base*pick(sARatios)),af.f,af.w,af.s);
  let g12=rndInt(GAP_MIN,GAP_MAX),g23=rndInt(GAP_MIN,GAP_MAX),gA=rndInt(GAP_MIN,GAP_MAX);

  // Temporarily compute pos to know hasOwnRow for size calculations
  // (will be recomputed properly after layout)
  const _posGuess = pick(['own','inline']);
  const _hasOwnRowGuess = _posGuess==='own';
  function stackH(s1,s23,sA,g12,g23,gA,hor){return s1+g12+s23+(hor?gA+sA+gA:0)+g23+s23;}
  const maxH=VH-PAD*2;
  if(stackH(s1,s23,sA,g12,g23,gA,_hasOwnRowGuess)>maxH){g12=0;g23=0;gA=0;}
  if(stackH(s1,s23,sA,0,0,0,_hasOwnRowGuess)>maxH){
    const sc=maxH/(s1+s23+s23+(_hasOwnRowGuess?sA:0));
    s23=Math.max(SZ_FLOOR,Math.floor(s23*sc));
    s1=Math.max(SZ_FLOOR,Math.floor(s1*sc));
    sA=Math.max(SZ_FLOOR,Math.floor(sA*sc));
    s1=fitSzWf(t1,s1,sf.f,sf.w,sf.s);
    sA=fitSzWf(tA,sA,af.f,af.w,af.s);
    g12=0;g23=0;gA=0;
  }

  const fw1=mWf(t1,s1,sf.f,sf.w,sf.s);
  const fw2=bf?mWf(t2,s23,bf.f,bf.w,bf.s):mW(t2,s23);
  const fw3=bf?mWf(t3,s23,bf.f,bf.w,bf.s):mW(t3,s23);
  const fwA=mWf(tA,sA,af.f,af.w,af.s);

  // Pick anchor types for each line independently
  const a1=pick(ANCHORS),a2=pick(ANCHORS),a3=pick(ANCHORS);

  // Pick ONE shared alignment column X — constrained so ALL words fit regardless of their anchor
  // For each word: L-anchored needs colX >= PAD, R-anchored needs colX <= VW-PAD
  //                C-anchored needs PAD+fw/2 <= colX <= VW-PAD-fw/2
  function safeRange(fw, anchorType){
    if(anchorType==='L') return{min:PAD, max:VW-PAD-fw};
    if(anchorType==='R') return{min:PAD+fw, max:VW-PAD};
    return{min:PAD+fw/2, max:VW-PAD-fw/2};
  }
  // Intersect safe ranges for all three lines
  const r1=safeRange(fw1,a1), r2=safeRange(fw2,a2), r3=safeRange(fw3,a3);
  const minCol=Math.max(r1.min,r2.min,r3.min);
  const maxCol=Math.min(r1.max,r2.max,r3.max);
  // If no single column works for all three, fall back to center for wide words
  const colX = minCol<=maxCol
    ? minCol + (maxCol-minCol)*Math.random()
    : VW/2; // safe fallback

  function makeLayout(fw, anchorType){
    const col=colX;
    const L=anchorType==='L'?col:anchorType==='C'?col-fw/2:col-fw;
    const R=L+fw;
    const ta=anchorType==='L'?'start':anchorType==='C'?'middle':'end';
    return{x:col, ta, L, R, col};
  }

  const fL1=makeLayout(fw1,a1);
  const fL2=makeLayout(fw2,a2);
  const fL3=makeLayout(fw3,a3);

  const wAc=mWf(tA,sA,af.f,af.w,af.s);
  const valid=[];
  if(fL2.R+SP+wAc<=VW-PAD)valid.push(1);
  valid.push(2);
  if(fL3.L-SP-wAc>=PAD)valid.push('3L');
  const weighted=[];
  valid.forEach(p=>{weighted.push(p);if(p===1||p==='3L')weighted.push(p);});
  const pos=pick(weighted);
  const hasOwnRow=pos===2;
  const vAlign=hasOwnRow?'middle':pick(['middle','bottom']);
  const finalH=stackH(s1,s23,sA,g12,g23,gA,hasOwnRow);
  const topY=Math.round((VH-finalH)/2);
  const B1=topY+s1,B2=B1+g12+s23,BA=hasOwnRow?B2+gA+sA:null,B3=hasOwnRow?BA+gA+s23:B2+g23+s23;

  let xA,ampY,taA;
  if(pos===1){xA=fL2.R+SP;taA='start';}
  else if(pos===2){
    // & on own row — center it at same column as CD
    xA=fL2.x; taA=fL2.ta;
  }
  else{xA=fL3.L-SP-fwA;taA='start';}
  if(hasOwnRow){ampY=BA;}
  else{const adjB=pos===1?B2:B3;ampY=ampPlace(vAlign,adjB,s23,sA).yA;}

  const ampCX=taA==='start'?xA+fwA/2:taA==='end'?xA-fwA/2:xA;
  const ampCY=ampY-sA*0.35;
  const minRFactor={'arrow':1.3,'ring':1.25,'heart':1.2}[shapeObj.id]||0.95;
  const shapeR=Math.round(sA*rnd(minRFactor,minRFactor+0.25));

  // ── Center the entire lockup horizontally ───────────────────────────────────
  // Compute bounding box across all three text lines, the & glyph, and its shape,
  // then shift every X coordinate so the whole composition sits centered in [PAD, VW-PAD].
  const bboxL=Math.min(fL1.L,fL2.L,fL3.L,xA-(taA==='start'?0:taA==='end'?fwA:fwA/2),ampCX-shapeR);
  const bboxR=Math.max(fL1.R,fL2.R,fL3.R,xA+(taA==='start'?fwA:taA==='end'?0:fwA/2),ampCX+shapeR);
  const bboxCenter=(bboxL+bboxR)/2;
  const shiftX=VW/2-bboxCenter;
  // Clamp shift so nothing moves outside the safe zone
  const maxShiftRight=VW-PAD-bboxR, maxShiftLeft=PAD-bboxL;
  const clampedShift=Math.max(maxShiftLeft,Math.min(maxShiftRight,shiftX));

  // Apply shift to all layout objects and coordinates
  fL1.x+=clampedShift; fL1.L+=clampedShift; fL1.R+=clampedShift;
  fL2.x+=clampedShift; fL2.L+=clampedShift; fL2.R+=clampedShift;
  fL3.x+=clampedShift; fL3.L+=clampedShift; fL3.R+=clampedShift;
  xA+=clampedShift;
  const ampCXFinal=ampCX+clampedShift;

  const sw=Math.min(4,Math.max(1.5,shapeR*.04));
  const ampHasFill=mode==='filled'&&shapeObj.cf;

  function lineOverlapsShape(lX,lW,lB,lSz,anchor){
    const lL=anchor==='start'?lX:anchor==='end'?lX-lW:lX-lW/2,lR=lL+lW;
    const lTop=lB-lSz,lBot=lB+lSz*0.2;
    const sL=ampCXFinal-shapeR*1.1,sR=ampCXFinal+shapeR*1.1,sTop=ampCY-shapeR*1.1,sBot=ampCY+shapeR*1.1;
    return lR>sL&&lL<sR&&lBot>sTop&&lTop<sBot;
  }
  function safeColor(col,lX,lW,lB,lSz,anchor){
    if(!ampHasFill)return col;
    if(!lineOverlapsShape(lX,lW,lB,lSz,anchor))return col;
    // Overlap detected — force the line to a color that's safe against the shape fill
    if(col===shapecol){
      return shapecol===TC.col ? BG : TC.col;
    }
    return col;
  }

  const c1=safeColor(pal.c[0],fL1.x,fw1,B1,s1,fL1.ta);
  const c2=safeColor(pal.c[1],fL2.x,fw2,B2,s23,fL2.ta);
  const c3=safeColor(pal.c[2],fL3.x,fw3,B3,s23,fL3.ta);

  // & text color: default to TC.col, which is guaranteed visible against BG
  // everywhere the glyph extends beyond its shape (the common failure mode).
  // Only when the shape itself is filled with TC.col do we need a different
  // & color so the glyph doesn't vanish into the shape's interior.
  let ampCol = (ampHasFill && shapecol===TC.col) ? BG : TC.col;
  if(ampCol===BG){
    // BG is only safe here because the shape (TC.col) covers most of the glyph;
    // but if shapecol equals BG too (shouldn't happen) fall back safely.
    if(shapecol===BG) ampCol=TC.col;
  }

  const tf=(t,x,y,sz,ta,col,font,weight,fstyle)=>
    `<text x="${x}" y="${y}" text-anchor="${ta}" font-family=${font||'"Unbounded",sans-serif'} font-weight="${weight||'700'}" font-style="${fstyle||'normal'}" font-size="${sz}" fill="${col||TC.col}">${t}</text>`;

  // ── Text background shapes ─────────────────────────────────────────────────
  // Each line: {x (svg text-anchor x), ta, L, R (pixel bounds), baseline, size}
  const lines=[
    {L:fL1.L,R:fL1.R,top:B1-s1,bot:B1*1.12,c:c1},
    {L:fL2.L,R:fL2.R,top:B2-s23,bot:B2*1.12,c:c2},
    {L:fL3.L,R:fL3.R,top:B3-s23,bot:B3*1.12,c:c3},
  ];

  // Pick a text-bg color different from text color — usually contrast, sometimes accent
  function pickTextBgColor(textCol){
    const opts=[TC.col,pickAccent(),shapecol].filter(c=>c!==textCol);
    return pick(opts.length?opts:[TC.col]);
  }

  // Stroke style: solid, dashed, dotted, gapped
  function strokeStyle(sw){
    const t=pick(['solid','solid','solid','dashed','dotted','gapped']);
    if(t==='solid')   return{sa:'none',sw};
    if(t==='dashed')  return{sa:`${sw*4},${sw*3}`,sw};
    if(t==='dotted')  return{sa:`${sw},${sw*2}`,sw:sw*1.5};
    if(t==='gapped')  return{sa:`${sw*6},${sw*4}`,sw};
    return{sa:'none',sw};
  }

  // Draw one text bg shape around a pixel rect [x0,y0,x1,y1]
  function drawTextBgShape(x0,y0,x1,y1,col,fillMode){
    const PADx=rndInt(8,28), PADy=rndInt(6,18);
    const rx0=x0-PADx, ry0=y0-PADy, rx1=x1+PADx, ry1=y1+PADy;
    const w=rx1-rx0, h=ry1-ry0;
    const cx=(rx0+rx1)/2, cy=(ry0+ry1)/2;
    const shapeType=pick(['rect-sharp','rect-sharp','rect-round','rect-round','ellipse']);
    const sw=rndInt(2,5);
    const {sa,sw:fsw}=strokeStyle(sw);
    const dashAttr=sa!=='none'?` stroke-dasharray="${sa}"`:'';
    let shapeOut='';
    if(fillMode==='filled'){
      const fillCol=col;
      if(shapeType==='rect-sharp')
        shapeOut=`<rect x="${rx0}" y="${ry0}" width="${w}" height="${h}" fill="${fillCol}" stroke="none"/>`;
      else if(shapeType==='rect-round'){
        const r=Math.min(h*0.4,24);
        shapeOut=`<rect x="${rx0}" y="${ry0}" width="${w}" height="${h}" rx="${r}" fill="${fillCol}" stroke="none"/>`;
      } else {
        shapeOut=`<ellipse cx="${cx}" cy="${cy}" rx="${w/2}" ry="${h/2}" fill="${fillCol}" stroke="none"/>`;
      }
    } else {
      // stroke only
      if(shapeType==='rect-sharp')
        shapeOut=`<rect x="${rx0}" y="${ry0}" width="${w}" height="${h}" fill="none" stroke="${col}" stroke-width="${fsw}"${dashAttr}/>`;
      else if(shapeType==='rect-round'){
        const r=Math.min(h*0.4,24);
        shapeOut=`<rect x="${rx0}" y="${ry0}" width="${w}" height="${h}" rx="${r}" fill="none" stroke="${col}" stroke-width="${fsw}"${dashAttr}/>`;
      } else {
        shapeOut=`<ellipse cx="${cx}" cy="${cy}" rx="${w/2}" ry="${h/2}" fill="none" stroke="${col}" stroke-width="${fsw}"${dashAttr}/>`;
      }
    }
    return shapeOut;
  }

  // shapeCoverages: array of {lineIndex, shapeCol, fillMode} — used to adjust text colors
  const shapeCoverages=[];

  let textBgShapes='';
  if(Math.random()<0.7){
    const fillMode=Math.random()<0.5?'filled':'stroke';
    const wrapMode=Math.random()<0.5?'individual':'combined';
    const n=pick([1,1,2,3]);
    const chosen=shuffle([0,1,2]).slice(0,n);

    if(wrapMode==='individual'){
      chosen.forEach(i=>{
        const col=pickTextBgColor(lines[i].c);
        textBgShapes+=drawTextBgShape(lines[i].L,lines[i].top,lines[i].R,lines[i].bot,col,fillMode);
        shapeCoverages.push({lineIndex:i,shapeCol:col,fillMode});
      });
    } else {
      const x0=Math.min(...chosen.map(i=>lines[i].L));
      const x1=Math.max(...chosen.map(i=>lines[i].R));
      const y0=Math.min(...chosen.map(i=>lines[i].top));
      const y1=Math.max(...chosen.map(i=>lines[i].bot));
      // For combined shape, pick color that differs from ALL covered text colors
      const allTextCols=chosen.map(i=>lines[i].c);
      const opts=[TC.col,pickAccent(),shapecol].filter(c=>!allTextCols.includes(c));
      const col=pick(opts.length?opts:[TC.col]);
      textBgShapes+=drawTextBgShape(x0,y0,x1,y1,col,fillMode);
      chosen.forEach(i=>shapeCoverages.push({lineIndex:i,shapeCol:col,fillMode}));
    }
  }

  // For filled shapes only: enforce text color contrasts against shape fill
  function contrastColor(textCol, shapeCol, fm){
    if(fm!=='filled') return textCol;
    if(textCol===shapeCol){
      return shapeCol===TC.col ? BG : TC.col;
    }
    return textCol;
  }

  // Apply contrast overrides
  let fc1=c1, fc2=c2, fc3=c3;
  shapeCoverages.forEach(({lineIndex,shapeCol,fillMode})=>{
    if(lineIndex===0) fc1=contrastColor(c1,shapeCol,fillMode);
    if(lineIndex===1) fc2=contrastColor(c2,shapeCol,fillMode);
    if(lineIndex===2) fc3=contrastColor(c3,shapeCol,fillMode);
  });

  let out=bgData.inner;
  out+=textBgShapes;
  out+=shapeObj.draw(ampCXFinal,ampCY,shapeR,mode,shapecol,strokecol,sw);
  out+=tf(tA,xA,ampY,sA,taA,ampCol,af.f,af.w,af.s);
  out+=tf(t1,fL1.x,B1,s1,fL1.ta,fc1,sf.f,sf.w,sf.s);
  out+=tf(t2,fL2.x,B2,s23,fL2.ta,fc2,bf?bf.f:null,bf?bf.w:null,bf?bf.s:null);
  out+=tf(t3,fL3.x,B3,s23,fL3.ta,fc3,bf?bf.f:null,bf?bf.w:null,bf?bf.s:null);

  const posLabel=pos===1?'right of CD':pos===2?'own row':'left of HoA';
  const shapeLabel=`${shapeObj.id}/${mode}/${shapecol===TC.col?'mono':'accent'}`;
  return{svg:out,state:{n:_seq,shape:shapeLabel,sfLabel:sf.label,afLabel:af.label,palLabel:'adapted',posLabel,vAlign:hasOwnRow?null:vAlign,s23,s1,sA,bgLabel:bgData.label,texLabel:bgData.texLabel,bgColor:bgData.bg}};
}

// ─── Public API ───────────────────────────────────────────────────────────────
function renderHeader(svgEl,opts){
  opts=opts||{};
  const{svg,state}=generate();
  let inner=svg;
  if(opts.debug){
    const debugCol=inner.includes('near-black')||inner.includes('black')?'rgba(255,255,255,0.3)':'rgba(0,0,0,0.2)';
    inner+=`<text x="${PAD}" y="${VH-8}" font-family="monospace" font-size="9" fill="${debugCol}">#${state.n} · ${state.bgLabel}/${state.texLabel} · Sr:${state.sfLabel} · &:${state.afLabel}</text>`;
  }
  svgEl.setAttribute('viewBox',`0 0 ${VW} ${VH}`);
  svgEl.setAttribute('preserveAspectRatio','xMidYMid slice');
  svgEl.innerHTML=inner;
  return state;
}

global.renderHeader=renderHeader;
global.HeaderConfig={VW,VH,PAD,ACCENTS};
})(window);































const SHEET_URL='https://script.google.com/macros/s/AKfycbyi4oh8EbDyicDxTQNuVZ43cf5o1D6E75wqpQ5bYaAO8yOwuaKN5aeQCqT9Qk3Vl7Ym/exec';
const TIMER_MS=5000;
let lastState={},timer=null,prog=null,startTime=null,lastVote=null;

function render(){
  lastState=renderHeader(document.getElementById('svg'),{debug:true});
  document.getElementById('inf').textContent='#'+lastState.n+' · '+lastState.bgLabel+'/'+lastState.texLabel;
  lastVote=null;
  document.getElementById('btn-like').classList.remove('chosen');
  document.getElementById('btn-dislike').classList.remove('chosen');
  startProgress();
}

function startProgress(){
  clearTimeout(timer);clearInterval(prog);
  startTime=Date.now();
  const bar=document.getElementById('prog');bar.style.width='0%';
  prog=setInterval(function(){
    const pct=Math.min(100,(Date.now()-startTime)/TIMER_MS*100);
    bar.style.width=pct+'%';
    if(pct>=100){
      clearInterval(prog);
      if(lastVote){
        const s=lastState;
        fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({vote:lastVote,shape:s.shape||'',font:s.sfLabel||'',ampFont:s.afLabel||'',
            bg:s.bgLabel||'',tex:s.texLabel||'',position:s.posLabel||'',vAlign:s.vAlign||'',
            base:s.s23||'',s1:s.s1||'',sA:s.sA||''})
        }).catch(function(){});
      }
      timer=setTimeout(render,100);
    }
  },80);
}

function castVote(vote){
  lastVote=(lastVote===vote)?null:vote;
  document.getElementById('btn-like').classList.toggle('chosen',lastVote==='like');
  document.getElementById('btn-dislike').classList.toggle('chosen',lastVote==='dislike');
}

function devVote(v){
  document.querySelectorAll('.fb-btn').forEach(function(b){b.classList.remove('chosen');});
  document.querySelector('.fb-btn.'+v).classList.add('chosen');
  const notes=document.getElementById('notes').value.trim();
  const s=lastState;
  const msg=(v==='yes'?'✓ Working':'✗ Not working')+' — #'+s.n+': bg='+s.bgLabel+'/'+s.texLabel+', shape="'+s.shape+'", Sr="'+s.sfLabel+'", &="'+s.afLabel+'"'+(notes?' | '+notes:'');
  if(typeof sendPrompt!=='undefined') sendPrompt(msg);
  else console.log('[dev]',msg);
  document.getElementById('notes').value='';
  setTimeout(render,400);
}

render();
document.fonts.ready.then(function(){
  lastState=renderHeader(document.getElementById('svg'),{debug:true});
});
</script>
