<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Inline&family=Bungee+Outline&family=Bungee+Shade&family=Rubik+Mono+One&family=Rubik+Wet+Paint&family=Rubik+Glitch&family=Rubik+Burned&family=Rubik+Beastly&family=Abril+Fatface&family=Bodoni+Moda:ital,wght@1,900&family=Big+Shoulders+Display:wght@900&family=Yeseva+One&family=Bowlby+One&family=Alfa+Slab+One&family=VT323&family=Major+Mono+Display&family=Share+Tech+Mono&family=Nova+Mono&family=Monoton&family=Faster+One&family=Bagel+Fat+One&family=Codystar&family=Gravitas+One&family=UnifrakturCook:wght@700&family=Pirata+One&family=Caveat+Brush&family=Permanent+Marker&family=Rampart+One&family=Bruno+Ace+SC&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0A0A0A;padding:16px;font-family:'Unbounded',sans-serif;}

.header-chip{position:relative;width:100%;aspect-ratio:16/5;background:#F7F4EE;border-radius:14px;overflow:hidden;}
.header-chip svg{position:absolute;inset:0;width:100%;height:100%;}
.progress-bar{position:absolute;bottom:0;left:0;height:3px;background:#926650;width:0%;z-index:10;}
.refresh-btn{position:absolute;bottom:10px;right:12px;z-index:20;background:rgba(10,10,10,0.5);border:none;color:#F7F4EE;border-radius:50%;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.refresh-btn:hover{background:rgba(10,10,10,0.85);}
.refresh-btn svg{width:14px;height:14px;}

.vote-section{margin-top:10px;background:#F7F4EE;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:16px;}
.vote-text{font-family:'Unbounded',sans-serif;font-weight:700;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#0A0A0A;line-height:1.7;flex:1;}
.vote-btns{display:flex;gap:8px;flex-shrink:0;}
.vote-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(10,10,10,0.15);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,transform .15s;}
.vote-btn:hover{border-color:rgba(10,10,10,0.4);transform:scale(1.08);}
.vote-btn.chosen{border:2.5px solid #0A0A0A;}

.dev-panel{margin-top:8px;background:#1a1a1a;border-radius:14px;padding:14px 16px;}
.dev-panel summary{font-family:monospace;font-size:10px;color:#555;cursor:pointer;list-style:none;outline:none;}
.dev-panel summary::-webkit-details-marker{display:none;}
.dev-inner{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
.fb-row{display:flex;gap:8px;align-items:center;}
.fb-lbl{font-size:10px;color:#555;}
.fb-btn{font-size:10px;padding:4px 14px;border-radius:6px;border:0.5px solid #444;background:#2a2a2a;color:#aaa;cursor:pointer;font-weight:600;}
.fb-btn.yes.chosen{background:#1a3d1a;border-color:#3a7a3a;color:#7dda7d;}
.fb-btn.no.chosen{background:#3d1a1a;border-color:#7a3a3a;color:#da7d7d;}
.fb-btn.yes:hover{background:#1a3d1a;color:#7dda7d;}
.fb-btn.no:hover{background:#3d1a1a;color:#da7d7d;}
.notes{width:100%;background:#242424;border:0.5px solid #333;border-radius:6px;color:#aaa;font-family:monospace;font-size:10px;padding:6px 10px;resize:none;outline:none;}
.inf{font-family:monospace;font-size:9px;color:#444;}
</style>
</head>
<body>

<div class="header-chip">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="progress-bar" id="prog"></div>
  <button class="refresh-btn" onclick="manualRefresh()" title="New artwork">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </svg>
  </button>
</div>

<div class="vote-section">
  <p class="vote-text">This header is AI-generated.<br>Your reaction helps improve future designs.</p>
  <div class="vote-btns">
    <button class="vote-btn" id="btn-like" onclick="castVote('like')" title="I like it">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
        <line x1="9" y1="9" x2="9.01" y2="9" stroke-width="2.5"/>
        <line x1="15" y1="9" x2="15.01" y2="9" stroke-width="2.5"/>
      </svg>
    </button>
    <button class="vote-btn" id="btn-dislike" onclick="castVote('dislike')" title="Not for me">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M16 16s-1.5-2-4-2-4 2-4 2"/>
        <line x1="9" y1="9" x2="9.01" y2="9" stroke-width="2.5"/>
        <line x1="15" y1="9" x2="15.01" y2="9" stroke-width="2.5"/>
      </svg>
    </button>
  </div>
</div>

<details class="dev-panel">
  <summary>⚙ Dev panel</summary>
  <div class="dev-inner">
    <div class="fb-row">
      <span class="fb-lbl">Verdict:</span>
      <button class="fb-btn yes" onclick="devVote('yes')">✓ Yes</button>
      <button class="fb-btn no"  onclick="devVote('no')">✗ No</button>
      <span class="inf" id="inf"></span>
    </div>
    <textarea class="notes" id="notes" rows="2" placeholder="Notes…"></textarea>
  </div>
</details>

<script>

(function(global){

  {id:'triU',cat:'solid',cf:true,draw:(cx,cy,r,m,f,s,sw)=>shapeEl(m,`<polygon points="${cx},${cy-r} ${cx+r*.87},${cy+r*.5} ${cx-r*.87},${cy+r*.5}"`,f,s,sw)},

// WIDGET CONTROLLER
// ═══════════════════════════════════════════════
const SHEET_URL='https://script.google.com/macros/s/AKfycbyi4oh8EbDyicDxTQNuVZ43cf5o1D6E75wqpQ5bYaAO8yOwuaKN5aeQCqT9Qk3Vl7Ym/exec';
const TIMER_MS=10000;
let lastState={},timer=null,prog=null,startTime=null,voted=false;

function render(){
  console.log('[widget] rendering new artwork');
  lastState=renderHeader(document.getElementById('svg'));
  document.getElementById('inf').textContent='#'+lastState.n;
  document.querySelectorAll('.fb-btn').forEach(b=>b.classList.remove('chosen'));
  voted=false;
  document.getElementById('btn-like').classList.remove('chosen');
  document.getElementById('btn-dislike').classList.remove('chosen');
  startProgress();
}

function startProgress(){
  clearTimeout(timer);
  clearInterval(prog);
  startTime=Date.now();
  const bar=document.getElementById('prog');
  bar.style.width='0%';
  console.log('[widget] timer started, will fire in '+TIMER_MS+'ms');
  prog=setInterval(function(){
    const pct=Math.min(100,(Date.now()-startTime)/TIMER_MS*100);
    bar.style.width=pct+'%';
    if(pct>=100){
      console.log('[widget] timer hit 100%, calling render');
      clearInterval(prog);
      timer=setTimeout(render,100);
    }
  },80);
}

function manualRefresh(){
  clearTimeout(timer);
  clearInterval(prog);
  render();
}

function castVote(vote){
  if(voted)return;
  voted=true;
  document.getElementById('btn-like').classList.remove('chosen');
  document.getElementById('btn-dislike').classList.remove('chosen');
  document.getElementById(vote==='like'?'btn-like':'btn-dislike').classList.add('chosen');
  const s=lastState;
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({vote,shape:s.shape||'',font:s.sfLabel||'',palette:s.palLabel||'',
      position:s.posLabel||'',vAlign:s.vAlign||'',base:s.s23||'',s1:s.s1||'',sA:s.sA||''})
  }).catch(()=>{});
}

function devVote(v){
  document.querySelectorAll('.fb-btn').forEach(b=>b.classList.remove('chosen'));
  document.querySelector('.fb-btn.'+v).classList.add('chosen');
  const notes=document.getElementById('notes').value.trim();
  const s=lastState;
  console.log(`[dev] ${v} — #${s.n}: shape="${s.shape}", font="${s.sfLabel}", palette="${s.palLabel}", &="${s.posLabel}"${s.vAlign?' · '+s.vAlign:''}, base=${s.s23} s1=${s.s1} sA=${s.sA}${notes?' | '+notes:''}`);
  document.getElementById('notes').value='';
  setTimeout(render,400);
}

// Boot
render();
document.fonts.ready.then(function(){
  const s=document.getElementById('svg');
  const state=renderHeader(s);
  lastState=state;
});
