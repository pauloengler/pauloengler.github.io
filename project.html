<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paulo Engler</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Inter:wght@400&family=Unbounded:wght@300;400;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0A; color: #0A0A0A; font-family: 'Unbounded', sans-serif; font-weight: 300; min-height: 100vh; }
    .site { display: flex; flex-direction: column; gap: 2px; background: #0A0A0A; min-height: 100vh; }

    /* ── NAV ── */
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #F7F4EE; position: sticky; top: 0; z-index: 100; }
    .nav-left, .nav-right { display: flex; gap: 20px; }
    .nav-left a, .nav-right a { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(10,10,10,0.35); text-decoration: none; transition: color 0.2s; }
    .nav-left a:hover, .nav-right a:hover { color: #0A0A0A; }

    /* ── PROJECT NAV (prev/next) ── */
    .project-nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 40px; background: #F7F4EE; border-top: 1px solid rgba(10,10,10,0.08); }
    .project-nav { display: flex; justify-content: space-between; align-items: center; padding: 16px 40px; background: #F7F4EE; border-top: 1px solid rgba(10,10,10,0.08); }
    .project-nav a { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; transition: color 0.2s; }
    .project-nav a:hover { color: #0A0A0A; }
    .nav-prev, .nav-next { display: flex; flex-direction: column; gap: 4px; max-width: 35%; color: rgba(10,10,10,0.35); }
    .nav-next { align-items: flex-end; text-align: right; }
    .nav-dir { font-size: 7px; letter-spacing: 0.15em; color: rgba(10,10,10,0.25); }
    .nav-project-name { font-weight: 700; font-size: 9px; color: rgba(10,10,10,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .nav-back { color: rgba(10,10,10,0.4); font-size: 8px; letter-spacing: 0.1em; border: 1px solid rgba(10,10,10,0.15); padding: 8px 16px; border-radius: 4px; white-space: nowrap; }
    .nav-back:hover { color: #0A0A0A; border-color: rgba(10,10,10,0.4); }

    /* ── PROJECT HEADER ── */
    .project-header { padding: 48px 40px 40px; background: #F7F4EE; }
    .project-client-label { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(10,10,10,0.3); margin-bottom: 10px; }
    .project-title { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: clamp(22px, 3vw, 40px); color: #0A0A0A; line-height: 1.1; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 20px; }
    .project-desc { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 13px; color: rgba(10,10,10,0.55); line-height: 1.85; max-width: 760px; }
    .project-desc p { margin-top: 16px; }
    .project-desc p:first-child { margin-top: 0; }
    .project-meta-block { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
    .project-meta-item { display: flex; flex-direction: column; gap: 3px; }
    .project-meta-label { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(10,10,10,0.3); }
    .project-meta-value { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 11px; color: rgba(10,10,10,0.7); letter-spacing: -0.01em; }

    /* ── AWARDS ── */
    .awards-section { background: #F7F4EE; padding: 40px; }
    .awards-label { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(10,10,10,0.25); margin-bottom: 24px; }
    .award-list { display: flex; flex-direction: column; gap: 16px; }
    .award-item { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    /* Award name pill: icon + name unified bar, fixed min-width so all are same size */
    .award-item-header { display: inline-flex; align-items: center; background: #E8E3DA; border-radius: 3px; overflow: hidden; flex-shrink: 0; min-width: 200px; }
    .award-item-icon { width: 28px; height: 28px; padding: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .award-item-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .award-item-name { font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 9px; color: #0A0A0A; text-transform: uppercase; letter-spacing: -0.01em; padding: 0 10px 0 6px; white-space: nowrap; }
    /* Metal chips: all same fixed width so they line up */
    .award-metals { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .award-cell { display: inline-flex; align-items: center; justify-content: space-between; gap: 5px; width: 52px; height: 20px; padding: 0 5px; border-radius: 3px; font-family: 'Unbounded', sans-serif; flex-shrink: 0; }
    .award-cell .cell-metal { font-size: 7px; font-weight: 300; letter-spacing: 0.02em; line-height: 1; text-transform: uppercase; }
    .award-cell .cell-count { font-size: 8px; font-weight: 700; line-height: 1; }
    .award-cell.metal-gp     { background: #1A1A1A; color: #F7F4EE; }
    .award-cell.metal-gold   { background: #A8874A; color: #fff; }
    .award-cell.metal-silver { background: #9AAFA8; color: #fff; }
    .award-cell.metal-bronze { background: #926650; color: #fff; }
    .award-cell.metal-other  { background: #C8C3B8; color: #555; }

    /* ── GALLERY ── */
    .gallery-section { background: #F7F4EE; display: flex; flex-direction: column; gap: 40px; padding: 40px; }
    .media-block { width: 100%; }
    .media-image img { width: 100%; height: auto; display: block; border-radius: 2px; }
    .media-video-local video { width: 100%; height: auto; display: block; }
    .media-video-yt { position: relative; }
    .yt-thumb-link { display: block; position: relative; cursor: pointer; }
    .yt-thumb-img { width: 100%; height: auto; display: block; }
    .yt-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 72px; height: 72px; transition: transform 0.2s; pointer-events: none; }
    .yt-thumb-link:hover .yt-play-btn { transform: translate(-50%, -50%) scale(1.1); }
    .embed-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .embed-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .media-text { padding: 40px; background: #F7F4EE; }
    .media-text p { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 10px; color: rgba(10,10,10,0.5); line-height: 1.85; max-width: 640px; }

    /* ── FOOTER NAV ── */
    .project-nav-bottom { display: flex; justify-content: space-between; align-items: center; padding: 16px 40px; background: #F7F4EE; border-top: 1px solid rgba(10,10,10,0.08); }

    /* ── FOOTER ── */
    footer { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #F7F4EE; margin-top: auto; }
    .footer-left, .footer-right { display: flex; gap: 20px; }
    .footer-left a, .footer-right a { font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(10,10,10,0.35); text-decoration: none; transition: color 0.2s; }
    .footer-left a:hover, .footer-right a:hover { color: #0A0A0A; }

    .loading { padding: 80px 40px; text-align: center; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(10,10,10,0.3); background: #F7F4EE; }

    @media (max-width: 600px) {
      nav, .project-nav, .project-header, .awards-section, .project-nav-bottom, footer { padding-left: 20px; padding-right: 20px; }
      .gallery-row.cols-2, .gallery-row.cols-3 { grid-template-columns: 1fr; }
      .project-title { font-size: clamp(18px, 5vw, 28px); }
    }
  </style>
</head>

<div class="site">

<nav>

<div id="project-content">

    <a href="index.html">Work</a>

  </div>
</footer>

</div>
<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVn3Mw1D4qw9pc_ifibalqvnFv3rEf1xQ8eFNvXNY_t8UyH1c8_MkfTG8KkrczCnsyYaQo4lW2O0E3/pub?output=csv';
const METALS = ['gp','gold','silver','bronze','short'];

function parseCSV(text) {
  // Handles multi-line quoted cells correctly
  const result = [];
  const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  let pos = 0;

  function parseRow() {
    const cols = [];
    while (pos < normalized.length) {
      if (normalized[pos] === '"') {
        // Quoted field
        pos++; // skip opening quote
        let val = '';
        while (pos < normalized.length) {
          if (normalized[pos] === '"' && normalized[pos+1] === '"') {
            val += '"'; pos += 2;
          } else if (normalized[pos] === '"') {
            pos++; break; // closing quote
          } else {
            val += normalized[pos++];
          }
        }
        cols.push(val);
        if (normalized[pos] === ',') pos++;
        else break;
      } else {
        // Unquoted field
        let val = '';
        while (pos < normalized.length && normalized[pos] !== ',' && normalized[pos] !== '\n') {
          val += normalized[pos++];
        }
        cols.push(val.trim());
        if (normalized[pos] === ',') pos++;
        else break;
      }
    }
    if (normalized[pos] === '\n') pos++;
    return cols;
  }

  parseRow(); // skip decorative label row
  const headers = parseRow().map(h => h.toLowerCase().trim());
  while (pos < normalized.length) {
    const cols = parseRow();
    if (cols.every(c => !c)) continue;
    const obj = {};
    cols.forEach(function(val, i) {
      const key = (headers[i] && headers[i] !== '') ? headers[i] : 'col' + (i + 1);
      obj[key] = val || '';
    });
    if (obj.name) result.push(obj);
  }
  return result;
}

function playYT(id) {
  const container = document.getElementById('yt-' + id);
  if (!container) return;
  container.innerHTML = '<div class="embed-wrap"><iframe src="https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1" allowfullscreen allow="autoplay; fullscreen"></iframe></div>';
}

function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function metalClass(m) {
  if (m==='gp')     return 'metal-gp';
  if (m==='gold')   return 'metal-gold';
  if (m==='silver') return 'metal-silver';
  if (m==='bronze') return 'metal-bronze';
  return 'metal-other';
}

function metalLabel(awardName, metal) {
  if (awardName.toLowerCase() === 'dandad') {
    return {gp:'B', gold:'Y', silver:'G', bronze:'W', short:'Sh'}[metal] || metal.toUpperCase();
  }
  return {gp:'GP', gold:'G', silver:'S', bronze:'B', short:'Sh', merit:'M'}[metal.toLowerCase()] || metal.toUpperCase();
}

function buildAwards(p) {
  const AWARD_KEYS = ['ame','archive','cannes','caples','clio','cliohealth','dandad','elojo','fiap','lia','loeries','lynx','madstars','newyork','one','phnks','wark','wave','webby','wpp'];
  const metalColMap = { gp:'gp', gold:'g', silver:'s', bronze:'b', short:'sh' };
  const cols = [];
  AWARD_KEYS.forEach(function(show) {
    const metals = [];
    METALS.forEach(function(m) {
      const col = show + '_' + metalColMap[m];
      const v = parseInt(p[col] || 0);
      if (v > 0) metals.push({metal:m, count:v});
    });
    if (metals.length) cols.push({name:show, metals:metals});
  });
  if (!cols.length) return '';

  const AWARD_NAMES = {
    ame: 'AME by New York Festivals',
    archive: "Lürzer's Archive Magazine",
    cannes: 'Cannes Lions',
    caples: 'Caples',
    clio: 'Clio',
    cliohealth: 'Clio Health',
    dandad: 'D&AD',
    elojo: 'El Ojo de Iberoamérica',
    fiap: 'Festival Iberoamericano de la Publicidad',
    lia: 'London International Awards (LIA)',
    loeries: 'Loeries',
    lynx: 'Dubai Lynx',
    madstars: 'Mad Stars',
    newyork: 'New York Festivals',
    one: 'One Show',
    phnks: 'Ad Forum PHNX',
    wark: 'WARK',
    wave: 'Wave Festival in Rio',
    webby: 'Webby Awards',
    wpp: 'WPP Cream'
  };

  const METAL_FULL = { gp: 'Grand Prix', gold: 'Gold', silver: 'Silver', bronze: 'Bronze', short: 'Shortlist' };
  const DANDAD_FULL = { gp: 'Black Pencil', gold: 'Yellow Pencil', silver: 'Graphite Pencil', bronze: 'Wood Pencil', short: 'Shortlist' };

  const METAL_SHORT = { gp:'Grand Prix', gold:'Gold', silver:'Silver', bronze:'Bronze', short:'Short' };
  const DANDAD_SHORT = { gp:'Black', gold:'Yellow', silver:'Graphite', bronze:'Wood', short:'Short' };

  const itemsHTML = cols.map(function(col) {
    const isDandad = col.name.toLowerCase() === 'dandad';
    const displayName = AWARD_NAMES[col.name.toLowerCase()] || col.name;

    const metalsHTML = col.metals.map(function(m) {
      const label = isDandad ? (DANDAD_SHORT[m.metal] || m.metal) : (METAL_SHORT[m.metal] || m.metal);
      const countHTML = m.count > 1 ? '<span class="cell-count">' + m.count + '</span>' : '';
      return '<div class="award-cell ' + metalClass(m.metal) + '">'
        + '<span class="cell-metal">' + label + '</span>'
        + countHTML
        + '</div>';
    }).join('');

    return '<div class="award-item">'
      + '<div class="award-item-header">'
      + '<div class="award-item-icon"><img src="icons/' + col.name.toLowerCase() + '.png" alt="' + displayName + '"></div>'
      + '<span class="award-item-name">' + displayName + '</span>'
      + '</div>'
      + '<div class="award-metals">' + metalsHTML + '</div>'
      + '</div>';
  }).join('');

  return '<div class="awards-section"><p class="awards-label">Awards</p><div class="award-list">' + itemsHTML + '</div></div>';
}

function youtubeID(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]+)/);
  return m ? m[1] : null;
}

function buildGallery(p) {
  const mediaRaw = (p.media || '').trim();
  if (!mediaRaw) return '';

  const items = mediaRaw.split('|').map(s => s.trim()).filter(Boolean);
  if (!items.length) return '';

  const blocks = items.map(function(item) {
    if (item.startsWith('img:')) {
      const file = item.slice(4).trim();
      return '<div class="media-block media-image"><img src="media/' + file + '" alt="" loading="lazy"></div>';
    } else if (item.startsWith('vid:')) {
      // Parse optional size hints: "vid:https://... w:420 h:315"
      const raw = item.slice(4).trim();
      const wMatch = raw.match(/\bw:(\d+)/);
      const hMatch = raw.match(/\bh:(\d+)/);
      const customW = wMatch ? parseInt(wMatch[1]) : null;
      const customH = hMatch ? parseInt(hMatch[1]) : null;
      const url = raw.replace(/\s+w:\d+/,'').replace(/\s+h:\d+/,'').trim();
      const isLocal = url.endsWith('.mp4') || url.endsWith('.webm');
      if (isLocal) {
        const sizeStyle = customW ? ' style="width:' + customW + 'px;max-width:100%;"' : '';
        return '<div class="media-block media-video-local"' + sizeStyle + '><video src="media/' + url + '" controls playsinline style="width:100%;height:auto;"></video></div>';
      } else {
        const id = youtubeID(url);
        if (!id) return '';
        const thumb = 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg';
        if (customW || customH) {
          const w = customW || 560;
          const h = customH || Math.round(w * 9 / 16);
          const ratio = Math.round(h / w * 100);
          // Use hqdefault as fallback — always available unlike maxresdefault
          const thumbHq = 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg';
          return '<div class="media-block">'
            + '<div class="media-video-yt" id="yt-' + id + '" style="width:' + w + 'px;max-width:100%;">'
            + '<div class="yt-thumb-link" onclick="playYT(\'' + id + '\')" style="position:relative;padding-top:' + ratio + '%;">'
            + '<img src="' + thumbHq + '" alt="Video" loading="lazy" class="yt-thumb-img" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">'
            + '<div class="yt-play-btn"><svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="18,10 62,36 18,62" fill="#fff"/></svg></div>'
            + '</div></div></div>';
        }
        return '<div class="media-block media-video-yt" id="yt-' + id + '">'
          + '<div class="yt-thumb-link" onclick="playYT(\'' + id + '\')">'
          + '<img src="' + thumb + '" alt="Video" loading="lazy" class="yt-thumb-img">'
          + '<div class="yt-play-btn"><svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="18,10 62,36 18,62" fill="#fff"/></svg></div>'
          + '</div></div>';
      }
    } else if (item.startsWith('txt:')) {
      const text = item.slice(4).trim();
      return '<div class="media-block media-text"><p>' + text + '</p></div>';
    }
    return '';
  }).join('');

  return '<div class="gallery-section">' + blocks + '</div>';
}

function buildNavHTML(prev, next) {
  let prevHTML = prev
    ? '<a href="project.html?id=' + (prev.slug || slugify(prev.name)) + '" class="nav-prev">← Previous</a>'
    : '<span></span>';
  let nextHTML = next
    ? '<a href="project.html?id=' + (next.slug || slugify(next.name)) + '" class="nav-next">Next →</a>'
    : '<span></span>';
  const backHTML = '<a href="index.html" class="nav-back">Back to Main</a>';
  return prevHTML + backHTML + nextHTML;
}

async function loadProject() {
  const id = getParam('id');
  if (!id) { window.location = 'index.html'; return; }

  try {
    const CACHE_KEY = 'portfolio_csv_v1';
    const CACHE_AGE = 5 * 60 * 1000;
    const cached = sessionStorage.getItem(CACHE_KEY);
    const cachedTime = sessionStorage.getItem(CACHE_KEY + '_time');
    let text;
    if (cached && cachedTime && (Date.now() - parseInt(cachedTime)) < CACHE_AGE) {
      text = cached;
    } else {
      const res = await fetch(SHEET_URL, { mode: 'cors', credentials: 'omit', redirect: 'follow' });
      text = await res.text();
      try { sessionStorage.setItem(CACHE_KEY, text); sessionStorage.setItem(CACHE_KEY + '_time', Date.now()); } catch(e) {}
    }
    const projects = parseCSV(text);

    const idx = projects.findIndex(p => (p.slug || slugify(p.name)) === id);
    if (idx === -1) {
      document.getElementById('project-content').innerHTML = '<div class="loading">Project not found.</div>';
      return;
    }

    const p = projects[idx];
    const prev = idx > 0 ? projects[idx - 1] : null;
    const next = idx < projects.length - 1 ? projects[idx + 1] : null;

    document.title = p.name + ' — Paulo Engler';

    // Top nav
    document.getElementById('project-nav-top').innerHTML = buildNavHTML(prev, next);

    // Main content
    document.getElementById('project-content').innerHTML =
      '<div class="project-header">'
        + '<p class="project-client-label">' + (p.client||'') + '</p>'
        + '<h1 class="project-title">' + p.name + '</h1>'
        + (function(){
            const d = (p['description project'] || p['descriptionproject'] || '').trim();
            if (!d) return '';
            return '<div class="project-desc">' + d.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(function(l){return l.trim();}).map(function(l){return '<p>'+l+'</p>';}).join('') + '</div>';
          }())
        + (p.role || p.year ? '<div class="project-meta-block">'
          + (p.role ? '<div class="project-meta-item"><span class="project-meta-label">Role</span><span class="project-meta-value">' + p.role + '</span></div>' : '')
          + (p.year ? '<div class="project-meta-item"><span class="project-meta-label">Year</span><span class="project-meta-value">' + p.year + '</span></div>' : '')
          + '</div>' : '')
      + '</div>'
      + buildGallery(p)
      + buildAwards(p);

    // Bottom nav
    const navBottom = document.getElementById('project-nav-bottom');
    navBottom.innerHTML = buildNavHTML(prev, next);
    navBottom.style.display = 'flex';
    navBottom.style.justifyContent = 'space-between';

  } catch(err) {
    document.getElementById('project-content').innerHTML = '<div class="loading">Could not load project.</div>';
    console.error(err);
  }
}

loadProject();
</script>
