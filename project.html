<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paulo Engler</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0A0A0A;
      color: #F0EDE8;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 40px;
      border-bottom: 0.5px solid rgba(240,237,232,0.12);
      position: sticky;
      top: 0;
      background: #0A0A0A;
      z-index: 100;
    }
    .nav-logo {
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #F0EDE8;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(240,237,232,0.5);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: #F0EDE8; }

    /* ── BACK LINK ── */
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(240,237,232,0.35);
      text-decoration: none;
      padding: 32px 40px 0;
      transition: color 0.2s;
    }
    .back:hover { color: #F0EDE8; }

    /* ── PROJECT HEADER ── */
    .project-header {
      padding: 40px 40px 48px;
      border-bottom: 0.5px solid rgba(240,237,232,0.08);
      max-width: 800px;
    }
    .project-client-label {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(240,237,232,0.35);
      margin-bottom: 12px;
    }
    .project-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(32px, 4vw, 56px);
      font-weight: 400;
      line-height: 1.1;
      color: #F0EDE8;
      margin-bottom: 24px;
    }
    .project-summary {
      font-size: 15px;
      color: rgba(240,237,232,0.55);
      line-height: 1.75;
      max-width: 620px;
    }
    .project-meta-row {
      display: flex;
      gap: 32px;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .meta-item { display: flex; flex-direction: column; gap: 4px; }
    .meta-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(240,237,232,0.25);
    }
    .meta-value {
      font-size: 12px;
      letter-spacing: 0.05em;
      color: rgba(240,237,232,0.6);
    }

    /* ── HERO IMAGE ── */
    .hero-image {
      width: 100%;
      aspect-ratio: 16/7;
      object-fit: cover;
      display: block;
      background: #E4A0B8;
      opacity: 0.85;
    }

    /* ── CONTENT BLOCKS ── */
    .project-body {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 40px;
    }

    /* Images grid — add class="images-2col" or "images-3col" in JS if needed */
    .images-1col { display: flex; flex-direction: column; gap: 2px; }
    .images-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
    .images-3col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; }

    .project-image {
      width: 100%;
      display: block;
      background: #E4A0B8;
    }
    .project-image img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    /* Video embed */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      margin: 40px 0;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* Text block */
    .text-block {
      margin: 48px 0;
      max-width: 620px;
    }
    .text-block p {
      font-size: 14px;
      line-height: 1.8;
      color: rgba(240,237,232,0.5);
    }

    /* Awards */
    .awards-block {
      margin: 48px 0;
      padding: 28px 32px;
      border: 0.5px solid rgba(240,237,232,0.1);
    }
    .awards-title {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(240,237,232,0.25);
      margin-bottom: 16px;
    }
    .award-item {
      font-size: 13px;
      color: rgba(240,237,232,0.55);
      padding: 8px 0;
      border-bottom: 0.5px solid rgba(240,237,232,0.07);
      letter-spacing: 0.03em;
    }
    .award-item:last-child { border-bottom: none; }

    /* ── NEXT PROJECT ── */
    .next-project {
      border-top: 0.5px solid rgba(240,237,232,0.08);
      padding: 0 40px;
    }
    .next-project a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 40px 0;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s;
    }
    .next-project a:hover { opacity: 0.7; }
    .next-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(240,237,232,0.25);
      margin-bottom: 6px;
    }
    .next-name {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 22px;
      color: #F0EDE8;
    }

    /* ── FOOTER ── */
    footer {
      padding: 48px 40px;
      border-top: 0.5px solid rgba(240,237,232,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer p { font-size: 11px; letter-spacing: 0.1em; color: rgba(240,237,232,0.25); }
    .footer-links { display: flex; gap: 24px; }
    .footer-links a {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(240,237,232,0.3);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-links a:hover { color: #F0EDE8; }

    .loading {
      padding: 100px 40px;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(240,237,232,0.2);
    }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      nav { padding: 20px; }
      .back { padding: 24px 20px 0; }
      .project-header { padding: 28px 20px 36px; }
      .project-body { padding: 40px 20px; }
      .images-2col, .images-3col { grid-template-columns: 1fr; }
      .next-project { padding: 0 20px; }
      footer { padding: 32px 20px; flex-direction: column; gap: 16px; text-align: center; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Paulo Engler</a>
  <ul class="nav-links">
    <li><a href="index.html">Work</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="mailto:hello@pauloengler.com">Contact</a></li>
  </ul>
</nav>

<a class="back" href="index.html">← All work</a>

<div id="project-content">
  <p class="loading">Loading project…</p>
</div>

<footer>
  <p>© 2026 Paulo Engler</p>
  <div class="footer-links">
    <a href="https://linkedin.com/in/pauloengler" target="_blank">LinkedIn</a>
    <a href="https://instagram.com/pauloengler_art" target="_blank">Instagram</a>
    <a href="mailto:hello@pauloengler.com">hello@pauloengler.com</a>
  </div>
</footer>

<script>
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVn3Mw1D4qw9pc_ifibalqvnFv3rEf1xQ8eFNvXNY_t8UyH1c8_MkfTG8KkrczCnsyYaQo4lW2O0E3/pub?output=csv';

  function slugify(str) {
    return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim().toLowerCase());
    return lines.slice(1).map(line => {
      const cols = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { inQ = !inQ; }
        else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
        else { cur += ch; }
      }
      cols.push(cur.trim());
      const obj = {};
      headers.forEach((h, i) => { obj[h] = (cols[i] || '').replace(/^"|"$/g, ''); });
      return obj;
    }).filter(p => p.name);
  }

  async function loadProject() {
    const id = getParam('id');
    if (!id) { window.location = 'index.html'; return; }

    try {
      const res = await fetch(SHEET_URL);
      const text = await res.text();
      const projects = parseCSV(text);

      const index = projects.findIndex(p => (p.slug || slugify(p.name)) === id);
      if (index === -1) { document.getElementById('project-content').innerHTML = '<p class="loading">Project not found.</p>'; return; }

      const p = projects[index];
      const next = projects[index + 1] || null;

      document.title = `${p.name} — Paulo Engler`;
      renderProject(p, next);

    } catch (err) {
      document.getElementById('project-content').innerHTML = '<p class="loading">Could not load project.</p>';
      console.error(err);
    }
  }

  function renderProject(p, next) {
    // Build images grid from comma-separated image URLs in "images" column
    const imageUrls = p.images ? p.images.split(',').map(s => s.trim()).filter(Boolean) : [];
    const heroUrl = p.image || (imageUrls[0] || '');
    const bodyImages = p.images ? imageUrls : [];

    // Awards from comma-separated "awards" column
    const awardList = p.awards ? p.awards.split(',').map(s => s.trim()).filter(Boolean) : (p.award ? [p.award] : []);

    // Video — paste a YouTube or Vimeo embed URL in the "video" column
    const videoHTML = p.video ? `
      <div class="video-wrapper">
        <iframe src="${p.video}" allowfullscreen allow="autoplay; fullscreen"></iframe>
      </div>` : '';

    // Images layout
    const gridClass = bodyImages.length === 2 ? 'images-2col' : bodyImages.length >= 3 ? 'images-2col' : 'images-1col';
    const imagesHTML = bodyImages.length ? `
      <div class="${gridClass}">
        ${bodyImages.map(url => `
          <div class="project-image" style="aspect-ratio:16/10">
            <img src="${url}" alt="${p.name}" loading="lazy">
          </div>`).join('')}
      </div>` : `
      <div class="images-1col">
        <div class="project-image" style="aspect-ratio:16/10; background:#E4A0B8;"></div>
        <div class="project-image" style="aspect-ratio:16/10; background:#E4A0B8;"></div>
      </div>`;

    // Awards block
    const awardsHTML = awardList.length ? `
      <div class="awards-block">
        <p class="awards-title">Awards</p>
        ${awardList.map(a => `<p class="award-item">${a}</p>`).join('')}
      </div>` : '';

    // Next project
    const nextHTML = next ? `
      <div class="next-project">
        <a href="project.html?id=${next.slug || slugify(next.name)}">
          <div>
            <p class="next-label">Next project</p>
            <p class="next-name">${next.name}</p>
          </div>
          <span style="font-size:20px; color:rgba(240,237,232,0.3)">→</span>
        </a>
      </div>` : '';

    // Meta row (only show items that have content)
    const metaItems = [
      p.client   ? `<div class="meta-item"><span class="meta-label">Client</span><span class="meta-value">${p.client}</span></div>` : '',
      p.chapter  ? `<div class="meta-item"><span class="meta-label">Category</span><span class="meta-value">${p.chapter}</span></div>` : '',
      p.role     ? `<div class="meta-item"><span class="meta-label">Role</span><span class="meta-value">${p.role}</span></div>` : '',
      p.year     ? `<div class="meta-item"><span class="meta-label">Year</span><span class="meta-value">${p.year}</span></div>` : '',
    ].join('');

    document.getElementById('project-content').innerHTML = `
      <div class="project-header">
        <p class="project-client-label">${p.client || ''}</p>
        <h1 class="project-title">${p.name}</h1>
        ${p.description ? `<p class="project-summary">${p.description}</p>` : ''}
        ${metaItems ? `<div class="project-meta-row">${metaItems}</div>` : ''}
      </div>

      ${heroUrl ? `<img class="hero-image" src="${heroUrl}" alt="${p.name}">` : '<div class="hero-image"></div>'}

      <div class="project-body">
        ${videoHTML}
        ${imagesHTML}
        ${p.body ? `<div class="text-block"><p>${p.body.replace(/\n/g,'</p><p>')}</p></div>` : ''}
        ${awardsHTML}
      </div>

      ${nextHTML}
    `;
  }

  loadProject();
</script>

</body>
</html>
