<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paulo Engler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #FFFFFF; color: #0A0A0A; font-family: 'JetBrains Mono', monospace; font-weight: 400; min-height: 100vh; }
    .site { display: flex; flex-direction: column; background: #FFFFFF; min-height: 100vh; }

    /* ── NAV ── */
    nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #FFFFFF; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #E5E5E5; }
    .nav-left, .nav-right { display: flex; gap: 20px; }
    .nav-left a, .nav-right a { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 11px; letter-spacing: 0.02em; text-transform: uppercase; color: #999999; text-decoration: none; transition: color 0.2s; }
    .nav-left a:hover, .nav-right a:hover { color: #0A0A0A; }

    /* ── PROJECT NAV (prev/next) ── */
    .project-nav { display: flex; justify-content: space-between; align-items: center; padding: 14px 40px; background: #FFFFFF; border-bottom: 1px solid #E5E5E5; }
    .project-nav a { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 11px; letter-spacing: 0.02em; text-transform: uppercase; text-decoration: none; color: #999999; transition: color 0.2s; }
    .project-nav a:hover { color: #0A0A0A; }
    .nav-prev, .nav-next { display: flex; flex-direction: column; gap: 2px; max-width: 35%; }
    .nav-next { align-items: flex-end; text-align: right; }
    .nav-dir { font-size: 9px; letter-spacing: 0.02em; color: #BBBBBB; }
    .nav-project-name { font-weight: 700; font-size: 11px; color: #0A0A0A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .nav-back { color: #0A0A0A; font-size: 11px; letter-spacing: 0.02em; border: 1px solid #0A0A0A; padding: 8px 16px; white-space: nowrap; }
    .nav-back:hover { background: #0A0A0A; color: #FFFFFF; }

    /* ── PROJECT HEADER ── */
    .project-header { padding: 48px 40px 40px; background: #FFFFFF; border-bottom: 1px solid #E5E5E5; }
    .project-client-label { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; color: #999999; margin-bottom: 6px; }
    .project-title { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: clamp(22px, 3vw, 40px); color: #0A0A0A; line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 16px; }
    .project-desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; color: #555555; line-height: 1.7; max-width: 760px; }
    .project-desc p { margin-top: 14px; }
    .project-desc p:first-child { margin-top: 0; }
    .project-meta-block { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 28px; }
    .project-meta-item { display: flex; flex-direction: column; gap: 3px; }
    .project-meta-label { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; color: #999999; }
    .project-meta-value { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; color: #0A0A0A; }

    /* ── AWARDS ── */
    .awards-section { background: #FFFFFF; padding: 40px; border-bottom: 1px solid #E5E5E5; }
    .awards-label { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; color: #999999; margin-bottom: 20px; }
    .award-list { display: flex; flex-direction: column; gap: 16px; }
    /* Each award = name bar on top, metals flush below — one unified block */
    .award-item { display: inline-flex; flex-direction: column; gap: 0; }
    /* Name bar: exactly 5×64px = 320px wide */
    .award-item-header { display: flex; align-items: center; width: 320px; height: 32px; background: #E8E3DA; overflow: hidden; flex-shrink: 0; }
    .award-item-icon { width: 32px; height: 32px; padding: 5px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .award-item-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .award-item-name { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 9px; color: #0A0A0A; text-transform: uppercase; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    /* Metals row: always 320px wide, 5 fixed slots of 64px each */
    .award-metals { display: flex; gap: 0; width: 320px; }
    .award-cell { display: inline-flex; align-items: center; justify-content: space-between; width: 64px; height: 22px; padding: 0 6px; font-family: 'Inter', sans-serif; flex-shrink: 0; }
    .award-cell-empty { width: 64px; height: 22px; flex-shrink: 0; background: transparent; }
    .award-cell .cell-metal { font-size: 7px; font-weight: 400; letter-spacing: 0.02em; line-height: 1; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
    .award-cell .cell-count { font-size: 8px; font-weight: 700; line-height: 1; flex-shrink: 0; }
    .award-cell.metal-gp     { background: #0A0A0A; color: #FFFFFF; }
    .award-cell.metal-gold   { background: #FFD400; color: #0A0A0A; }
    .award-cell.metal-silver { background: #808080; color: #FFFFFF; }
    .award-cell.metal-bronze { background: #FF6B00; color: #FFFFFF; }
    .award-cell.metal-other  { background: #EFEFEF; color: #777; }

    /* ── GALLERY ── */
    .gallery-section { background: #FFFFFF; display: flex; flex-direction: column; gap: 0; padding: 0; align-items: center; overflow: hidden; }
    .media-block { width: 100%; max-width: 800px; }
    .media-image img { width: 100%; height: auto; display: block; }
    .media-video-local video { width: 100%; height: auto; display: block; }
    .media-video-yt { position: relative; }
    .yt-thumb-link { display: block; position: relative; cursor: pointer; }
    .yt-thumb-img { width: 100%; height: auto; display: block; }
    .yt-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 72px; height: 72px; transition: transform 0.2s; pointer-events: none; }
    .yt-thumb-link:hover .yt-play-btn { transform: translate(-50%, -50%) scale(1.1); }
    .embed-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .embed-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .media-text { padding: 0; width: 100%; max-width: 800px; }

    /* ── ROW LAYOUT ── */
    .media-row { display: flex; gap: 0; width: 100%; align-items: flex-start; }
    .media-row .media-block { flex: 1; min-width: 0; }

    /* ── CUSTOM VIDEO PLAYER ── */
    .r2-player { position: relative; width: 100%; background: transparent; cursor: pointer; }
    .r2-player video { display: block; width: 100%; height: auto; background: #E8E8E8; }
    .r2-player .r2-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
    .r2-player.paused .r2-overlay { opacity: 1; }
    .r2-play-icon { width: 56px; height: 56px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.25); }
    .r2-play-icon svg { width: 20px; height: 20px; margin-left: 4px; }
    .r2-controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 24px 12px 8px; background: linear-gradient(transparent, rgba(0,0,0,0.5)); opacity: 0; transition: opacity 0.25s; }
    .r2-player:hover .r2-controls,
    .r2-player.paused .r2-controls { opacity: 1; }
    .r2-progress { width: 100%; height: 3px; background: rgba(255,255,255,0.25); cursor: pointer; position: relative; border-radius: 2px; }
    .r2-progress-fill { height: 100%; background: #fff; border-radius: 2px; width: 0%; pointer-events: none; transition: width 0.1s linear; }
    .r2-progress:hover { height: 5px; }
    .media-text p { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 13px; color: #666666; line-height: 1.7; max-width: 640px; text-align: left; }

    /* ── FOOTER NAV ── */
    .project-nav-bottom { display: flex; justify-content: space-between; align-items: center; padding: 14px 40px; background: #FFFFFF; border-top: 1px solid #E5E5E5; }

    /* ── FOOTER ── */
    footer { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #0A0A0A; margin-top: auto; }
    .footer-left, .footer-right { display: flex; gap: 20px; }
    .footer-left a, .footer-right a { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 11px; letter-spacing: 0.02em; text-transform: uppercase; color: rgba(255,255,255,0.4); text-decoration: none; transition: color 0.2s; }
    .footer-left a:hover, .footer-right a:hover { color: #FFFFFF; }

    .loading { padding: 80px 40px; text-align: center; font-size: 11px; letter-spacing: 0.02em; text-transform: uppercase; color: #999999; background: #FFFFFF; }

    @media (max-width: 600px) {
      nav, .project-nav, .project-header, .awards-section, .gallery-section, .project-nav-bottom, footer { padding-left: 20px; padding-right: 20px; }
      .gallery-row.cols-2, .gallery-row.cols-3 { grid-template-columns: 1fr; }
      .project-title { font-size: clamp(18px, 5vw, 28px); }
    }
  </style>
</head>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRVn3Mw1D4qw9pc_ifibalqvnFv3rEf1xQ8eFNvXNY_t8UyH1c8_MkfTG8KkrczCnsyYaQo4lW2O0E3/pub?output=csv';
const METALS = ['gp','gold','silver','bronze','short'];

function parseCSV(text) {
  // Handles multi-line quoted cells correctly
  const result = [];
  const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  let pos = 0;

  function parseRow() {
    const cols = [];
    while (pos < normalized.length) {
      if (normalized[pos] === '"') {
        // Quoted field
        pos++; // skip opening quote
        let val = '';
        while (pos < normalized.length) {
          if (normalized[pos] === '"' && normalized[pos+1] === '"') {
            val += '"'; pos += 2;
          } else if (normalized[pos] === '"') {
            pos++; break; // closing quote
          } else {
            val += normalized[pos++];
          }
        }
        cols.push(val);
        if (normalized[pos] === ',') pos++;
        else break;
      } else {
        // Unquoted field
        let val = '';
        while (pos < normalized.length && normalized[pos] !== ',' && normalized[pos] !== '\n') {
          val += normalized[pos++];
        }
        cols.push(val.trim());
        if (normalized[pos] === ',') pos++;
        else break;
      }
    }
    if (normalized[pos] === '\n') pos++;
    return cols;
  }

  parseRow(); // skip decorative label row
  const headers = parseRow().map(h => h.toLowerCase().trim());
  while (pos < normalized.length) {
    const cols = parseRow();
    if (cols.every(c => !c)) continue;
    const obj = {};
    cols.forEach(function(val, i) {
      const key = (headers[i] && headers[i] !== '') ? headers[i] : 'col' + (i + 1);
      obj[key] = val || '';
    });
    if (obj.name) result.push(obj);
  }
  return result;
}

function vimeoID(url) {
  const m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  return m ? m[1] : null;
}

function playVideo(id, type) {
  const container = document.getElementById('vid-' + id);
  if (!container) return;
  if (type === 'vimeo') {
    container.innerHTML = '<div class="embed-wrap"><iframe src="https://player.vimeo.com/video/' + id + '?autoplay=1&title=0&byline=0&portrait=0&dnt=1" allow="autoplay; fullscreen" allowfullscreen frameborder="0"></iframe></div>';
  } else if (type === 'r2') {
    container.innerHTML = '<div class="embed-wrap"><video src="' + id + '" controls autoplay playsinline style="position:absolute;inset:0;width:100%;height:100%;background:#000;"></video></div>';
  } else {
    container.innerHTML = '<div class="embed-wrap"><iframe src="https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&cc_load_policy=0&fs=1" allowfullscreen allow="autoplay; fullscreen"></iframe></div>';
  }
}

function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function metalClass(m) {
  if (m==='gp')     return 'metal-gp';
  if (m==='gold')   return 'metal-gold';
  if (m==='silver') return 'metal-silver';
  if (m==='bronze') return 'metal-bronze';
  return 'metal-other';
}

function metalLabel(awardName, metal) {
  if (awardName.toLowerCase() === 'dandad') {
    return {gp:'B', gold:'Y', silver:'G', bronze:'W', short:'Sh'}[metal] || metal.toUpperCase();
  }
  return {gp:'GP', gold:'G', silver:'S', bronze:'B', short:'Sh', merit:'M'}[metal.toLowerCase()] || metal.toUpperCase();
}

function buildAwards(p) {
  const AWARD_KEYS = ['ame','archive','cannes','caples','clio','cliohealth','dandad','elojo','fiap','lia','loeries','lynx','madstars','newyork','one','phnks','wark','wave','webby','wpp'];
  const metalColMap = { gp:'gp', gold:'g', silver:'s', bronze:'b', short:'sh' };
  const cols = [];
  AWARD_KEYS.forEach(function(show) {
    const metals = [];
    METALS.forEach(function(m) {
      const col = show + '_' + metalColMap[m];
      const v = parseInt(p[col] || 0);
      if (v > 0) metals.push({metal:m, count:v});
    });
    if (metals.length) cols.push({name:show, metals:metals});
  });
  if (!cols.length) return '';

  const AWARD_NAMES = {
    ame: 'AME by New York Festivals',
    archive: "Lürzer's Archive Magazine",
    cannes: 'Cannes Lions',
    caples: 'Caples',
    clio: 'Clio',
    cliohealth: 'Clio Health',
    dandad: 'D&AD',
    elojo: 'El Ojo de Iberoamérica',
    fiap: 'Festival Iberoamericano de la Publicidad',
    lia: 'London International Awards (LIA)',
    loeries: 'Loeries',
    lynx: 'Dubai Lynx',
    madstars: 'Mad Stars',
    newyork: 'New York Festivals',
    one: 'One Show',
    phnks: 'Ad Forum PHNX',
    wark: 'WARK',
    wave: 'Wave Festival in Rio',
    webby: 'Webby Awards',
    wpp: 'WPP Cream'
  };

  const METAL_FULL = { gp: 'Grand Prix', gold: 'Gold', silver: 'Silver', bronze: 'Bronze', short: 'Shortlist' };
  const DANDAD_FULL = { gp: 'Black Pencil', gold: 'Yellow Pencil', silver: 'Graphite Pencil', bronze: 'Wood Pencil', short: 'Shortlist' };

  const METAL_SHORT = { gp:'Grand Prix', gold:'Gold', silver:'Silver', bronze:'Bronze', short:'Short' };
  const DANDAD_SHORT = { gp:'Black', gold:'Yellow', silver:'Graphite', bronze:'Wood', short:'Short' };

  const itemsHTML = cols.map(function(col) {
    const isDandad = col.name.toLowerCase() === 'dandad';
    const displayName = AWARD_NAMES[col.name.toLowerCase()] || col.name;

    const metalsHTML = col.metals.map(function(m) {
      const label = isDandad ? (DANDAD_SHORT[m.metal] || m.metal) : (METAL_SHORT[m.metal] || m.metal);
      const countHTML = '<span class="cell-count">' + m.count + '</span>';
      return '<div class="award-cell ' + metalClass(m.metal) + '">'
        + '<span class="cell-metal">' + label + '</span>'
        + countHTML
        + '</div>';
    }).join('');
    // Pad to always 5 slots so metals row is always 320px
    const emptySlots = Math.max(0, 5 - col.metals.length);
    const paddingHTML = '<div class="award-cell-empty"></div>'.repeat(emptySlots);

    return '<div class="award-item">'
      + '<div class="award-item-header">'
      + '<div class="award-item-icon"><img src="icons/' + col.name.toLowerCase() + '.png" alt="' + displayName + '"></div>'
      + '<span class="award-item-name">' + displayName + '</span>'
      + '</div>'
      + '<div class="award-metals">' + metalsHTML + paddingHTML + '</div>'
      + '</div>';
  }).join('');

  return '<div class="awards-section"><p class="awards-label">Awards</p><div class="award-list">' + itemsHTML + '</div></div>';
}

function youtubeID(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]+)/);
  return m ? m[1] : null;
}

function buildGallery(p) {
  const mediaRaw = (p.media || '').trim();
  if (!mediaRaw) return '';

  // Normalize: replace any newlines (from CSV multiline cells) with spaces before splitting
  const normalized = mediaRaw.replace(/[\r\n]+/g,' ');

  // Parse row: ... :row groups and standalone items
  // Strategy: split on | first, then group consecutive items inside row: ... :row
  const rawItems = normalized.split('|').map(s => s.trim()).filter(Boolean);
  if (!rawItems.length) return '';

  // Group into segments: either a single item or an array of items (row group)
  const segments = [];
  let inRow = false;
  let rowItems = [];
  let rowWidth = null;
  rawItems.forEach(function(item) {
    if (item.toLowerCase().startsWith('row:')) {
      inRow = true;
      const rest = item.slice(4).trim();
      // Check for w: on the row tag itself e.g. "row: w:800"
      const rowWMatch = rest.match(/^w:(\d+)\s*/);
      if (rowWMatch) { rowWidth = parseInt(rowWMatch[1]); }
      else if (rest) rowItems.push(rest);
    } else if (item.toLowerCase().endsWith(':row')) {
      const rest = item.slice(0, -4).trim();
      if (rest) rowItems.push(rest);
      segments.push({ type: 'row', items: rowItems, width: rowWidth });
      rowItems = [];
      rowWidth = null;
      inRow = false;
    } else if (inRow) {
      rowItems.push(item);
    } else {
      segments.push({ type: 'single', item: item });
    }
  });
  // Close any unclosed row
  if (rowItems.length) segments.push({ type: 'row', items: rowItems, width: rowWidth });

  const blocks = segments.map(function(seg) {
    if (seg.type === 'row') {
      const rowBlocks = seg.items.map(function(item) { return renderItem(item); }).join('');
      const rowStyle = seg.width ? 'width:' + seg.width + 'px;max-width:100%;' : 'width:100%;';
      return '<div class="media-row" style="' + rowStyle + '">' + rowBlocks + '</div>';
    }
    return renderItem(seg.item);
  });
  function renderItem(item) {
    if (item.startsWith('img:')) {
      const rawImg = item.slice(4).trim();
      const wMatchI = rawImg.match(/\bw:(\d+)/);
      const hMatchI = rawImg.match(/\bh:(\d+)/);
      const imgW = wMatchI ? parseInt(wMatchI[1]) : null;
      const imgH = hMatchI ? parseInt(hMatchI[1]) : null;
      const imgFile = rawImg.replace(/\s+w:\d+/,'').replace(/\s+h:\d+/,'').trim();
      // Width constraint on the wrapper, image fills it naturally
      const wrapStyle = imgW
        ? ' style="width:' + imgW + 'px;max-width:100%;"'
        : '';
      const imgStyle = imgH
        ? ' style="width:100%;height:' + imgH + 'px;object-fit:cover;display:block;"'
        : ' style="width:100%;height:auto;display:block;"';
      return '<div class="media-block media-image"' + wrapStyle + '><img src="media/' + imgFile + '" alt="" loading="lazy"' + imgStyle + '></div>';
    } else if (item.startsWith('vid:')) {
      // Parse optional size hints: "vid:https://... w:420 h:315"
      const raw = item.slice(4).trim();
      const wMatch = raw.match(/\bw:(\d+)/);
      const hMatch = raw.match(/\bh:(\d+)/);
      const pMatch = raw.match(/\bp:([^\s|]+)/);
      const arMatch = raw.match(/\bar:(\d+):(\d+)/);
      const customW = wMatch ? parseInt(wMatch[1]) : null;
      const customH = hMatch ? parseInt(hMatch[1]) : null;
      const customPoster = pMatch ? pMatch[1] : null;
      const customAR = arMatch ? (parseInt(arMatch[1]) + '/' + parseInt(arMatch[2])) : null;
      const url = raw.replace(/\s+w:\d+/,'').replace(/\s+h:\d+/,'').replace(/\s+p:[^\s|]+/,'').replace(/\s+ar:\d+:\d+/,'').trim();
      // Local = no protocol (not http/https), not r2.dev, not cloudflarestorage
      const isLocal = !url.startsWith('http') && !url.includes('r2.dev') && !url.includes('cloudflarestorage');
      if (isLocal) {
        const sizeStyle = customW ? ' style="width:' + customW + 'px;max-width:100%;"' : '';
        return '<div class="media-block media-video-local"' + sizeStyle + '><video src="media/' + url + '" controls playsinline style="width:100%;height:auto;"></video></div>';
      } else {
        // R2 / direct video file
        if (url.match(/\.(mp4|webm|mov)$/i) || url.includes('r2.dev') || url.includes('cloudflarestorage')) {
          const customPosterUrl = customPoster ? (customPoster.startsWith('http') ? customPoster : 'media/' + customPoster) : null;
          const autoThumb = url.replace(/\.(mp4|webm|mov)$/i, '_thumb.jpg');
          const pid = 'r2p-' + Math.random().toString(36).slice(2,7);
          const wrapStyle = (customW || customH)
            ? 'width:' + (customW||560) + 'px;max-width:100%;'
            : 'width:100%;';
          const videoSrc = url;
          const posterAttr = customPosterUrl ? ' poster="' + customPosterUrl + '"' : '';
          const arStyle = customAR ? 'aspect-ratio:' + customAR + ';' : '';
          return '<div class="media-block"><div style="' + wrapStyle + '">'
            + '<div class="r2-player paused" id="' + pid + '" onclick="r2Toggle(\'' + pid + '\')">'
            + '<video src="' + videoSrc + '"' + posterAttr + ' playsinline preload="metadata" style="width:100%;height:auto;display:block;background:#E8E8E8;' + arStyle + '"></video>'
            + '<div class="r2-overlay"><div class="r2-play-icon"><svg viewBox="0 0 24 24" fill="white"><polygon points="6,3 20,12 6,21"/></svg></div></div>'
            + '<div class="r2-controls" onclick="event.stopPropagation()">'
            + '<div class="r2-progress" onmousedown="r2Seek(event,\'' + pid + '\')" ontouchstart="r2Seek(event,\'' + pid + '\')">'
            + '<div class="r2-progress-fill" id="' + pid + '-fill"></div>'
            + '</div></div></div>'
            + '</div></div>';
        }
        const ytId = youtubeID(url);
        const vmId = vimeoID(url);
        if (!ytId && !vmId) return '';
        const isVimeo = !!vmId;
        const id = isVimeo ? vmId : ytId;
        const type = isVimeo ? 'vimeo' : 'youtube';
        const thumb = isVimeo
          ? 'https://vumbnail.com/' + id + '.jpg'
          : 'https://img.youtube.com/vi/' + id + '/sddefault.jpg';
        const thumbFb = isVimeo
          ? 'https://vumbnail.com/' + id + '_medium.jpg'
          : 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg';
        const playBtn = '<div class="yt-play-btn"><svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg"><polygon points="18,10 62,36 18,62" fill="#fff"/></svg></div>';
        if (customW || customH) {
          const w = customW || 560;
          const h = customH || Math.round(w * 9 / 16);
          const ratio = Math.round(h / w * 100);
          return '<div class="media-block">'
            + '<div class="media-video-yt" id="vid-' + id + '" style="width:' + w + 'px;max-width:100%;">'
            + '<div class="yt-thumb-link" onclick="playVideo(\'' + id + '\',\'' + type + '\')" style="position:relative;padding-top:' + ratio + '%;">'
            + '<img src="' + thumb + '" onerror="this.src=\'' + thumbFb + '\'" alt="Video" loading="lazy" class="yt-thumb-img" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">'
            + playBtn + '</div></div></div>';
        }
        return '<div class="media-block media-video-yt" id="vid-' + id + '">'
          + '<div class="yt-thumb-link" onclick="playVideo(\'' + id + '\',\'' + type + '\')" style="position:relative;padding-top:56.25%;overflow:hidden;">'
          + '<img src="' + thumb + '" onerror="this.src=\'' + thumbFb + '\'" alt="Video" loading="lazy" class="yt-thumb-img" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">'
          + playBtn + '</div></div>';
      }
    } else if (item.startsWith('txt:')) {
      const text = item.slice(4).trim();
      return '<div class="media-block media-text"><p>' + text + '</p></div>';
    } else if (item.startsWith('empty:')) {
      const px = parseInt(item.slice(6).trim()) || 40;
      return '<div style="height:' + px + 'px;"></div>';
    }
    return '';
  }

  return '<div class="gallery-section">' + blocks + '</div>';
}

function buildNavHTML(prev, next) {
  let prevHTML = prev
    ? '<a href="project.html?id=' + (prev.slug || slugify(prev.name)) + '" class="nav-prev">← Previous</a>'
    : '<span></span>';
  let nextHTML = next
    ? '<a href="project.html?id=' + (next.slug || slugify(next.name)) + '" class="nav-next">Next →</a>'
    : '<span></span>';
  const backHTML = '<a href="index.html" class="nav-back">Back to Main</a>';
  return prevHTML + backHTML + nextHTML;
}

async function loadProject() {
  const id = getParam('id');
  if (!id) { window.location = 'index.html'; return; }

  try {
    const CACHE_KEY = 'portfolio_csv_v1';
    const CACHE_AGE = 5 * 60 * 1000;
    const cached = sessionStorage.getItem(CACHE_KEY);
    const cachedTime = sessionStorage.getItem(CACHE_KEY + '_time');
    let text;
    if (cached && cachedTime && (Date.now() - parseInt(cachedTime)) < CACHE_AGE) {
      text = cached;
    } else {
      const res = await fetch(SHEET_URL, { mode: 'cors', credentials: 'omit', redirect: 'follow' });
      text = await res.text();
      try { sessionStorage.setItem(CACHE_KEY, text); sessionStorage.setItem(CACHE_KEY + '_time', Date.now()); } catch(e) {}
    }
    const projects = parseCSV(text);

    const idx = projects.findIndex(p => (p.slug || slugify(p.name)) === id);
    if (idx === -1) {
      document.getElementById('project-content').innerHTML = '<div class="loading">Project not found.</div>';
      return;
    }

    const p = projects[idx];
    const prev = idx > 0 ? projects[idx - 1] : null;
    const next = idx < projects.length - 1 ? projects[idx + 1] : null;

    document.title = p.name + ' — Paulo Engler';

    // Top nav
    document.getElementById('project-nav-top').innerHTML = buildNavHTML(prev, next);

    // Main content
    document.getElementById('project-content').innerHTML =
      '<div class="project-header">'
        + '<p class="project-client-label">' + (p.client||'') + '</p>'
        + '<h1 class="project-title">' + p.name + '</h1>'
        + (function(){
            const d = (p['description project'] || p['descriptionproject'] || '').trim();
            if (!d) return '';
            return '<div class="project-desc">' + d.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(function(l){return l.trim();}).map(function(l){return '<p>'+l+'</p>';}).join('') + '</div>';
          }())
        + (p.role || p.year ? '<div class="project-meta-block">'
          + (p.role ? '<div class="project-meta-item"><span class="project-meta-label">Role</span><span class="project-meta-value">' + p.role + '</span></div>' : '')
          + (p.year ? '<div class="project-meta-item"><span class="project-meta-label">Year</span><span class="project-meta-value">' + p.year + '</span></div>' : '')
          + '</div>' : '')
      + '</div>'
      + buildGallery(p)
      + buildAwards(p);

    // Bottom nav
    const navBottom = document.getElementById('project-nav-bottom');
    navBottom.innerHTML = buildNavHTML(prev, next);
    navBottom.style.display = 'flex';
    navBottom.style.justifyContent = 'space-between';

  } catch(err) {
    document.getElementById('project-content').innerHTML = '<div class="loading">Could not load project.</div>';
    console.error(err);
  }
}

// ── CUSTOM R2 PLAYER ──────────────────────────────────────────
function r2Toggle(pid) {
  const wrap = document.getElementById(pid);
  if (!wrap) return;
  const vid = wrap.querySelector('video');
  if (vid.paused) {
    vid.play();
    wrap.classList.remove('paused');
  } else {
    vid.pause();
    wrap.classList.add('paused');
  }
}

function r2Seek(e, pid) {
  e.stopPropagation();
  const wrap = document.getElementById(pid);
  if (!wrap) return;
  const vid = wrap.querySelector('video');
  const bar = wrap.querySelector('.r2-progress');
  function doSeek(evt) {
    const t = evt.touches ? evt.touches[0] : evt;
    const rect = bar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (t.clientX - rect.left) / rect.width));
    vid.currentTime = pct * vid.duration;
  }
  doSeek(e);
  function onMove(ev) { doSeek(ev); }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchmove', onMove);
  document.addEventListener('touchend', onUp);
}

// Update progress bars
document.addEventListener('timeupdate', function(e) {
  if (e.target.tagName !== 'VIDEO') return;
  const vid = e.target;
  const wrap = vid.closest('.r2-player');
  if (!wrap) return;
  const fill = wrap.querySelector('.r2-progress-fill');
  if (fill && vid.duration) fill.style.width = (vid.currentTime / vid.duration * 100) + '%';
}, true);

// Reset to paused state when video ends
document.addEventListener('ended', function(e) {
  if (e.target.tagName !== 'VIDEO') return;
  const wrap = e.target.closest('.r2-player');
  if (wrap) wrap.classList.add('paused');
}, true);

loadProject();
</script>
